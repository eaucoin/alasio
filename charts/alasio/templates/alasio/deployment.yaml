{{- $name := include "alasio.fullname" . -}}
{{- $home := ternary .Values.host.home "/var/lib/alasio/home" (and .Values.host.enabled .Values.host.alasioHome) -}}
{{- $uid := ternary .Values.host.uid .Values.alasio.runAsUser .Values.host.enabled -}}
{{- $gid := ternary .Values.host.gid .Values.alasio.runAsGroup .Values.host.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "alasio.componentLabels" (dict "root" . "component" "alasio") | nindent 4 }}
spec:
  # One Telegram poller and one SQLite writer: never two alasio at once, so an update
  # stops the old pod before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "alasio.selectorLabels" (dict "root" . "component" "alasio") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "alasio.componentLabels" (dict "root" . "component" "alasio") | nindent 8 }}
      annotations:
        checksum/sandbox-templates: {{ include (print $.Template.BasePath "/alasio/sandbox-templates.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      # alasio finishes its turns' bookkeeping and records what it interrupts as it stops.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $uid }}
        runAsGroup: {{ $gid }}
        fsGroup: {{ $gid }}
        {{- $groups := concat .Values.alasio.supplementalGroups (ternary .Values.host.supplementalGroups (list) .Values.host.enabled) | uniq }}
        {{- with $groups }}
        supplementalGroups: {{- toYaml . | nindent 10 }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- include "alasio.imagePullSecrets" . | nindent 6 }}
      initContainers:
        # alasio's state directory and, unless it is the operator's, its home, on its volume.
        - name: prepare
          image: {{ include "alasio.image" (dict "image" .Values.images.alasio "root" .) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: [mkdir, -p, /var/lib/alasio/state, /var/lib/alasio/home]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: state, mountPath: /var/lib/alasio }
      containers:
        - name: alasio
          image: {{ include "alasio.image" (dict "image" .Values.images.alasio "root" .) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          workingDir: {{ $home }}
          env:
            - { name: ALASIO_KUBE_TEMPLATES, value: /etc/alasio/templates.json }
            - { name: ALASIO_STATE_DIR, value: /var/lib/alasio/state }
            - { name: HOME, value: {{ $home | quote }} }
            - { name: ALASIO_DEPLOYMENT, value: {{ $name | quote }} }
            - name: ALASIO_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "alasio.telegram.existingSecret is required" .Values.alasio.telegram.existingSecret }}
                  key: token
            - name: TELEGRAM_ALLOWED_USER_IDS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alasio.telegram.existingSecret }}
                  key: allowedUserIds
            - { name: ALASIO_DATABASE_URL_FILE, value: /run/alasio/database/url }
            - { name: ALASIO_LAKE_PASSWORD_FILE, value: /run/alasio/database/lake-password }
            - { name: ALASIO_LAKE_ENABLED, value: {{ ternary "1" "0" (and .Values.lake.enabled .Values.neon.enabled) | quote }} }
            - { name: ALASIO_TELEMETRY_RECEIVER_SERVICE, value: {{ printf "%s.%s.svc" (include "alasio.componentName" (dict "root" . "component" "telemetry")) .Release.Namespace | quote }} }
            - { name: ALASIO_TELEMETRY_RECEIVER_PORT, value: {{ .Values.telemetry.receiverPort | quote }} }
            {{- with .Values.alasio.defaultHarness }}
            - { name: ALASIO_DEFAULT_HARNESS, value: {{ . | quote }} }
            {{- end }}
            {{- if and .Values.host.enabled .Values.host.workspaceRoot }}
            - { name: ALASIO_WORKSPACE_ROOT, value: {{ .Values.host.workspaceRoot | quote }} }
            {{- end }}
            {{- with .Values.alasio.claude.existingSecret }}
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.alasio.claude.key }}
            {{- end }}
            {{- include "alasio.otelEnv" . | nindent 12 }}
            {{- range $key, $value := .Values.alasio.env }}
            - { name: {{ $key }}, value: {{ $value | quote }} }
            {{- end }}
          {{- with .Values.alasio.envFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - { name: telemetry, containerPort: {{ .Values.telemetry.receiverPort }} }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources: {{- toYaml .Values.alasio.resources | nindent 12 }}
          volumeMounts:
            - { name: state, mountPath: /var/lib/alasio }
            - { name: templates, mountPath: /etc/alasio, readOnly: true }
            - { name: database, mountPath: /run/alasio/database, readOnly: true }
            {{- if .Values.host.enabled }}
            {{- include "alasio.hostVolumeMounts" . | nindent 12 }}
            {{- end }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ .Values.alasio.persistence.existingClaim | default $name }}
        - name: templates
          configMap:
            name: {{ include "alasio.componentName" (dict "root" . "component" "sandbox-templates") }}
        - name: database
          secret:
            secretName: {{ include "alasio.databaseSecret" . }}
            items:
              - { key: url, path: url }
              - { key: lake-password, path: lake-password }
        {{- if .Values.host.enabled }}
        {{- include "alasio.hostVolumes" . | nindent 8 }}
        {{- end }}
      {{- with .Values.alasio.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.alasio.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.alasio.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if not .Values.alasio.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels: {{- include "alasio.componentLabels" (dict "root" . "component" "alasio") | nindent 4 }}
  annotations:
    # alasio's state outlives the release: uninstalling does not delete it.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.alasio.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.alasio.persistence.size }}
{{- end }}
---
# Where session sandboxes export their telemetry: alasio's receiver.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "alasio.componentName" (dict "root" . "component" "telemetry") }}
  labels: {{- include "alasio.componentLabels" (dict "root" . "component" "alasio") | nindent 4 }}
spec:
  selector: {{- include "alasio.selectorLabels" (dict "root" . "component" "alasio") | nindent 4 }}
  ports:
    - name: otlp-http
      port: {{ .Values.telemetry.receiverPort }}
      targetPort: telemetry
