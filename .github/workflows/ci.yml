name: ci

# The memory-snapshot benchmark, on this throwaway branch alone: the branch's
# own ci.yml, as GitHub dispatches only workflows whose file is on the default branch. One job
# per system x target x profile, each installing its system and running every fixture, size and
# run on its runner; then the results aggregated, and alasio's images deleted.
on:
  workflow_dispatch:
    inputs:
      systems:
        description: "Systems, of alasio gvisor firecracker criu"
        type: string
        default: "alasio gvisor firecracker criu"
      targets:
        description: "alasio's targets, of host docker (the others run on the host alone)"
        type: string
        default: "host"
      profiles:
        description: "Store profiles, of local s3-standard s3-express"
        type: string
        default: "local s3-standard s3-express"
      variants:
        description: "Variants, a job each, of the systems that name them (alasio: as-shipped with-fix whole; gvisor: all tuned defaults; criu: all phaul splice chain patched eager; firecracker: all chunk-16mib); each system's own default where empty or none of its"
        type: string
        default: ""
      cases:
        description: "Fixture cases, as fixture/MiB (all if empty)"
        type: string
        default: ""
      runs:
        description: "Runs of each case"
        type: string
        default: "5"
      images:
        description: "alasio's images of an earlier run, kept, as ghcr.io/eaucoin/alasio-ci/run-<id>-<attempt> (built anew if empty)"
        type: string
        default: ""
      cpu:
        description: "The runner CPU model every bench job must have, others failing at once to be re-run (any if empty)"
        type: string
        default: "AMD EPYC 7763 64-Core Processor"
      kernel:
        description: "The prefix of the runner kernel's release every bench job must have, others failing at once to be re-run (any if empty)"
        type: string
        default: "7.0."
      keep-images:
        description: "Keep the images this run builds, for later runs, to be deleted by hand"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Where the images job pushes alasio's images, as ci.yml on main does.
  REGISTRY: ghcr.io/eaucoin/alasio-ci

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      alasio: ${{ steps.matrix.outputs.alasio }}
    steps:
      - id: matrix
        name: Say the jobs
        shell: bash
        env:
          SYSTEMS: ${{ inputs.systems }}
          TARGETS: ${{ inputs.targets }}
          PROFILES: ${{ inputs.profiles }}
          VARIANTS: ${{ inputs.variants }}
        run: |
          words() { jq --raw-input --compact-output '[splits("[\\s,]+") | select(. != "")]' <<<"$1"; }
          matrix=$(jq --null-input --compact-output \
            --argjson systems "$(words "$SYSTEMS")" --argjson targets "$(words "$TARGETS")" --argjson profiles "$(words "$PROFILES")" --argjson variants "$(words "$VARIANTS")" '
            {alasio: ["as-shipped", "with-fix", "whole", "no-compaction", "settled", "kept-cache"], gvisor: ["all", "tuned", "defaults"], firecracker: ["all", "chunk-16mib"], criu: ["all", "phaul", "splice", "chain", "patched", "eager"]} as $variantsOf
            | {alasio: ["as-shipped", "with-fix"], gvisor: ["all"], firecracker: ["all"], criu: ["all"]} as $defaults
            | ($variantsOf | keys) as $known
            | ["local", "s3-standard", "s3-express"] as $shapes
            | if ($systems - $known) != [] then "::error::no system \($systems - $known | join(", "))\n" | halt_error(1)
              elif ($profiles - $shapes) != [] then "::error::no profile \($profiles - $shapes | join(", "))\n" | halt_error(1)
              else . end
            | {include: [$systems[] as $system | $profiles[] as $profile
                | (if $system == "alasio" then $targets[] else "host" end) as $target
                | ([$variantsOf[$system][] | select(. as $each | $variants | index($each))] | if . == [] then $defaults[$system] else . end)[] as $variant
                | {system: $system, target: $target, profile: $profile, variant: $variant}]}')
          echo "matrix=$matrix" | tee --append "$GITHUB_OUTPUT"
          echo "alasio=$(jq --arg s alasio 'index($s) != null' <<<"$(words "$SYSTEMS")")" | tee --append "$GITHUB_OUTPUT"

  # alasio's images, as ci.yml on main builds and pushes them, for the alasio jobs to install.
  images:
    needs: matrix
    if: needs.matrix.outputs.alasio == 'true' && inputs.images == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      registry: ${{ steps.push.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: push
        name: Build and push the images
        shell: bash
        env:
          PUSH_TO: ${{ env.REGISTRY }}/run-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          declare -A pids
          for image in "alasio:." "alasio-agent:sandbox/agent" "alasio-lake:neon/lake" "alasio-grafana:neon/grafana" "alasio-log:neon/log" "alasio-collector:neon/collector" "alasio-webhook:webhook" "alasio-node:cluster/node"; do
            name=${image%%:*}
            {
              if [ "$name" = alasio-node ]; then
                mapfile -t args < <(node tooling/node-image.ts)
                docker build "${args[@]}" --tag "$PUSH_TO/$name:e2e" --label "org.opencontainers.image.source=$SOURCE" "${image#*:}" &&
                  docker push "$PUSH_TO/$name:e2e"
              else
                revision=()
                if [ "$name" = alasio ]; then revision=(--build-arg "REVISION=$GITHUB_SHA"); fi
                push=tooling/push-whole.sh
                if [ "$name" = alasio-agent ]; then push=tooling/push-estargz.sh; fi
                "$push" "$PUSH_TO/$name:e2e" "${image#*:}" "${revision[@]}" --label "org.opencontainers.image.source=$SOURCE" &&
                  if [ "$name" = alasio ]; then
                    tooling/push-whole.sh "$PUSH_TO/alasio-harness-stand-ins:e2e" test --file test/e2e/harness-stand-ins.Dockerfile \
                      --build-arg "ALASIO=$PUSH_TO/alasio:e2e" --label "org.opencontainers.image.source=$SOURCE"
                  fi
              fi
            } 2>&1 | sed -u "s/^/$name: /" &
            pids[$name]=$!
          done
          failed=0
          for name in "${!pids[@]}"; do
            wait "${pids[$name]}" || { echo "::error::$name was not built and pushed"; failed=1; }
          done
          echo "registry=$PUSH_TO" >>"$GITHUB_OUTPUT"
          exit "$failed"

  bench:
    needs: [matrix, images]
    if: ${{ !cancelled() && needs.matrix.result == 'success' && needs.images.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    name: bench (${{ matrix.system }}, ${{ matrix.target }}, ${{ matrix.profile }}, ${{ matrix.variant }})
    env:
      # Beside the checkout, on the runner's disk.
      BENCH_DIR: /home/runner/bench-work
      BENCH_SYSTEM: ${{ matrix.system }}
      BENCH_TARGET: ${{ matrix.target }}
      BENCH_PROFILE: ${{ matrix.profile }}
      # The variant a job runs: alasio's, one a job; criu's, its default ("all") or a tuning one; "all" for the others, which run all theirs.
      BENCH_VARIANT: ${{ matrix.variant }}
      BENCH_CASES: ${{ inputs.cases }}
      BENCH_RUNS: ${{ inputs.runs }}
    steps:
      # Every system's measures are of one CPU model, and of the disk that comes with it: a job
      # elsewhere ends at once, to be re-run (gh run rerun <id> --failed) until it lands on one.
      - name: The runner's CPU and kernel, as pinned
        env:
          PINNED: ${{ inputs.cpu }}
          KERNEL: ${{ inputs.kernel }}
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)
          release=$(uname -r)
          echo "$model, $release"
          [ -z "$PINNED" ] || [ "$model" = "$PINNED" ] || { echo "::error::this runner's CPU is $model, not $PINNED: re-run this job"; exit 3; }
          [[ $release == "$KERNEL"* ]] || { echo "::error::this runner's kernel is $release, not $KERNEL*: re-run this job"; exit 3; }
      # What the runner comes with that no system uses goes, as ci.yml's end-to-end jobs do it:
      # the images, the caches and k3s's images need the disk.
      - name: Free disk space
        shell: bash
        run: |
          for dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/heroku /opt/microsoft /opt/google /opt/az; do
            sudo rm -rf "$dir" &
          done
          docker system prune --all --force >/dev/null &
          wait
          df -h /
      - name: KVM, for Firecracker
        if: matrix.system == 'firecracker'
        run: |
          test -c /dev/kvm || { echo "::error::this runner has no /dev/kvm"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: The common pieces
        working-directory: bench/common
        run: |
          bun install --frozen-lockfile
          node driver/build.ts
          node --test --test-concurrency=1 test/*.test.ts
      - name: The runner
        run: |
          mkdir -p "$BENCH_DIR"
          bench/common/host.sh "$BENCH_DIR/staging" | tee "$BENCH_DIR/host.json"
      - name: The store, and how it answers through its profile
        if: matrix.system != 'alasio'
        run: |
          bench/common/store/up.sh "$BENCH_DIR/store" "$BENCH_PROFILE"
          set -a
          . "$BENCH_DIR/store/store.env"
          set +a
          node bench/common/dist/probe.mjs | tee "$BENCH_DIR/store.json"
      - name: Run ${{ matrix.system }}
        run: bench/${{ matrix.system }}/run.sh "$BENCH_TARGET" "$BENCH_PROFILE"
        env:
          ALASIO_E2E_REGISTRY: ${{ inputs.images || needs.images.outputs.registry }}
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.system }}-${{ matrix.target }}-${{ matrix.profile }}-${{ matrix.variant }}
          path: |
            ${{ env.BENCH_DIR }}/results.jsonl
            ${{ env.BENCH_DIR }}/host.json
            ${{ env.BENCH_DIR }}/store.json
            ${{ env.BENCH_DIR }}/logs/
          if-no-files-found: warn

  aggregate:
    needs: bench
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: results
      - name: Aggregate
        run: |
          (cd bench/common && bun install --frozen-lockfile)
          mapfile -t files < <(find results -name results.jsonl -size +0)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no job wrote results"; exit 1; }
          node bench/common/aggregate/aggregate.ts --out summary "${files[@]}"
          cat summary/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: summary
          path: summary/

  # Whatever came of the rest, the run's images are deleted, as ci.yml on main does, unless kept.
  delete-images:
    needs: [images, bench]
    if: always() && needs.images.result != 'skipped' && !inputs.keep-images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete the run's images
        shell: bash
        run: |
          failed=0
          for attempt in $(seq "$GITHUB_RUN_ATTEMPT"); do
            for name in alasio alasio-agent alasio-lake alasio-grafana alasio-log alasio-collector alasio-webhook alasio-node alasio-harness-stand-ins; do
              image="$REGISTRY/run-$GITHUB_RUN_ID-$attempt/$name"
              package="alasio-ci/run-$GITHUB_RUN_ID-$attempt/$name"
              if said=$(gh api --method DELETE "/users/eaucoin/packages/container/${package//\//%2F}" 2>&1); then
                echo "deleted $image"
              elif [[ $said == *"HTTP 404"* ]]; then
                echo "no $image to delete"
              else
                echo "::error::$image was not deleted: $said"
                failed=1
              fi
            done
          done
          exit "$failed"
