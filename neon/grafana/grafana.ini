# Grafana's settings as alasio runs it, over its defaults. What differs from one
# installation to another is given by its Deployment, as GF_ variables: its database's
# host and password, its admin's password, and its secret key.
#
# It keeps nothing but in its database, in Neon, and reaches nothing but its database,
# the lake's query endpoint and Telegram's Bot API: no plugin is installed or updated,
# no key fetched, no news or update looked for, and nothing reported.

[database]
type = postgres
name = grafana
user = grafana
ssl_mode = disable

[security]
admin_user = admin
disable_gravatar = true

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[snapshots]
external_enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[plugins]
preinstall_disabled = true
public_key_retrieval_disabled = true

[log]
mode = console
