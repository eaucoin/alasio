# alasio's alert rules, evaluated every minute on the lake through its query endpoint,
# each alerting through the Telegram bot (policies.yaml). A rule whose query fails, the
# lake's endpoint being down, alerts as a data source error. They count main's turns and
# telemetry alone: a branch environment's (tagged alasio.branch) show on the Agents
# dashboard, and page no one.
apiVersion: 1
groups:
  - orgId: 1
    name: alasio
    folder: alasio
    interval: 1m
    rules:
      - uid: alasio-stack-unhealthy
        title: A service of the stack is down
        condition: down
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.service }} has answered none of the collector's scrapes for three minutes."
        data:
          - refId: up
            relativeTimeRange: {from: 180, to: 0}
            datasourceUid: lake
            model:
              refId: up
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select ServiceName as service, max(Value) as up
                  from otel.metrics_gauge
                  where MetricName = 'up' and TimeUnix > now()::timestamp - interval 3 minute
                  group by 1
              root_selector: ""
              columns:
                - {selector: service, text: service, type: string}
                - {selector: up, text: up, type: number}
          - refId: down
            datasourceUid: __expr__
            model:
              refId: down
              type: threshold
              expression: up
              conditions: [{evaluator: {type: lt, params: [1]}}]

      - uid: alasio-turns-failing
        title: Turns are failing
        condition: failing
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $values.failed }} of the turns of {{ $labels.conversation }} failed in the last ten minutes."
        data:
          - refId: failed
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: lake
            model:
              refId: failed
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select SpanAttributes['alasio.conversation.id'] as conversation, count(*) as failed
                  from otel.traces
                  where SpanName = 'alasio.turn' and ServiceName = 'alasio' and ResourceAttributes['alasio.branch'] is null
                    and (StatusCode = 'Error' or SpanAttributes['alasio.turn.outcome'] = 'failed')
                    and Timestamp > now()::timestamp - interval 10 minute
                  group by 1
              root_selector: ""
              columns:
                - {selector: conversation, text: conversation, type: string}
                - {selector: failed, text: failed, type: number}
          - refId: failing
            datasourceUid: __expr__
            model:
              refId: failing
              type: threshold
              expression: failed
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: alasio-telemetry-absent
        title: Telemetry is absent
        condition: absent
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "No metric has reached the lake for five minutes: its intake, the log, or the stack's collector, is down."
        data:
          - refId: points
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: lake
            model:
              refId: points
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select count(*) as points
                  from otel.metrics_gauge
                  where ResourceAttributes['alasio.branch'] is null and TimeUnix > now()::timestamp - interval 5 minute
              root_selector: ""
              columns:
                - {selector: points, text: points, type: number}
          - refId: absent
            datasourceUid: __expr__
            model:
              refId: absent
              type: threshold
              expression: points
              conditions: [{evaluator: {type: lt, params: [1]}}]

      - uid: alasio-object-store-filling
        title: The object store is filling its disk
        condition: filling
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.server }} may fill {{ $values.left }}% more of its disk before it takes no more writes, past its minFreeSpace, and once none of the volume servers takes any, nor does the object store: give its disk room, or the store a volume server on another."
        data:
          - refId: left
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: lake
            model:
              refId: left
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select Attributes['pod'] as server,
                    round(100 * arg_max(Value, TimeUnix) filter (where Attributes['type'] = 'avail') / arg_max(Value, TimeUnix) filter (where Attributes['type'] = 'all'), 1) as "left"
                  from otel.metrics_gauge
                  where ServiceName = 'seaweedfs' and MetricName = 'SeaweedFS_volumeServer_resource' and TimeUnix > now()::timestamp - interval 5 minute
                  group by 1
              root_selector: ""
              columns:
                - {selector: server, text: server, type: string}
                - {selector: left, text: left, type: number}
          - refId: filling
            datasourceUid: __expr__
            model:
              refId: filling
              type: threshold
              expression: left
              conditions: [{evaluator: {type: lt, params: [10]}}]

      - uid: alasio-node-disk-full
        title: A node's disk is nearly full
        condition: full
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.node }}'s disk is {{ $values.used }}% full. Images, the caches of those stargz-snapshotter's daemon pulls lazily, which kubelet's image GC does not see, and the stack's volumes share it; a full one fails what reads them."
        data:
          - refId: used
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: lake
            model:
              refId: used
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select ResourceAttributes['k8s.node.name'] as node,
                    round(100 * (1 - arg_max(Value, TimeUnix) filter (where MetricName = 'k8s.node.filesystem.available')
                      / arg_max(Value, TimeUnix) filter (where MetricName = 'k8s.node.filesystem.capacity')), 1) as used
                  from otel.metrics_gauge
                  where MetricName in ('k8s.node.filesystem.available', 'k8s.node.filesystem.capacity')
                    and TimeUnix > now()::timestamp - interval 10 minute
                  group by 1
              root_selector: ""
              columns:
                - {selector: node, text: node, type: string}
                - {selector: used, text: used, type: number}
          - refId: full
            datasourceUid: __expr__
            model:
              refId: full
              type: threshold
              expression: used
              conditions: [{evaluator: {type: gt, params: [90]}}]

      - uid: alasio-valkey-memory
        title: A Valkey nears its memory limit
        condition: near
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.valkey }} holds {{ $values.held }}% of what it may: at its limit it refuses writes. Give it more: the filer store's objectStore.bundled.filerStore.entries, workspace storage's workspaceStorage.valkey.maxmemory."
        data:
          - refId: held
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: lake
            model:
              refId: held
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select ResourceAttributes['server.address'] as valkey,
                    round(100 * arg_max(Value, TimeUnix) filter (where MetricName = 'redis.memory.used') / arg_max(Value, TimeUnix) filter (where MetricName = 'redis.maxmemory'), 1) as held
                  from otel.metrics_gauge
                  where MetricName in ('redis.memory.used', 'redis.maxmemory') and ResourceAttributes['server.address'] is not null
                    and TimeUnix > now()::timestamp - interval 5 minute
                  group by 1
              root_selector: ""
              columns:
                - {selector: valkey, text: valkey, type: string}
                - {selector: held, text: held, type: number}
          - refId: near
            datasourceUid: __expr__
            model:
              refId: near
              type: threshold
              expression: held
              conditions: [{evaluator: {type: gt, params: [90]}}]

      - uid: alasio-object-store-under-replicated
        title: The object store keeps fewer copies than it should
        condition: under
        for: 90m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $values.volumes }} volumes of the object store's collection {{ $labels.collection }} have had fewer copies than objectStore.bundled.replication keeps for longer than the hourly lifecycle pass takes to copy them again: is a volume server lost, or has none of the others room?"
        data:
          - refId: volumes
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: lake
            model:
              refId: volumes
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  with latest as (
                    select Attributes['pod'] as master, coalesce(Attributes['collection'], '') as collection, arg_max(Value, TimeUnix) as volumes
                    from otel.metrics_gauge
                    where ServiceName = 'seaweedfs' and MetricName = 'SeaweedFS_master_under_replicated_volumes' and TimeUnix > now()::timestamp - interval 5 minute
                    group by 1, 2)
                  select collection, max(volumes) as volumes from latest group by 1
              root_selector: ""
              columns:
                - {selector: collection, text: collection, type: string}
                - {selector: volumes, text: volumes, type: number}
          - refId: under
            datasourceUid: __expr__
            model:
              refId: under
              type: threshold
              expression: volumes
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: alasio-wakes-failing
        title: Computes are not waking
        condition: failing
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "{{ $values.failed }} wakes of Neon's computes failed in the last ten minutes: connections to them are refused."
        data:
          - refId: failed
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: lake
            model:
              refId: failed
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select coalesce(sum(failed), 0)::int as failed from (
                    select greatest(Value - lag(Value) over (partition by ResourceAttributes['service.instance.id'] order by TimeUnix), 0) as failed
                    from otel.metrics_sum
                    where MetricName = 'neon_control_wake_failures_total' and TimeUnix > now()::timestamp - interval 10 minute
                  )
              root_selector: ""
              columns:
                - {selector: failed, text: failed, type: number}
          - refId: failing
            datasourceUid: __expr__
            model:
              refId: failing
              type: threshold
              expression: failed
              conditions: [{evaluator: {type: gt, params: [0]}}]

      # Of the sessions restored from their snapshots in the last hour, or meant to be, the
      # share that fell back to bayma's checkpoints for a failure: its snapshot stale (a
      # restore cut short), no node to restore on, its image not prepared, its restore
      # failing, or its snapshot unreadable. One whose
      # template or gVisor release is no longer kept falls back as designed, after an
      # upgrade, and counts neither way. A session is restored at most once each time it
      # comes back from idle, so restores are few, and the window an hour: one failure among
      # four or fewer pages, as each costs a session its REPLs. The sandbox gateway counts
      # them, which snapshots main's sessions alone: its counts are running totals, since
      # its process started, exported every minute: what a series added is each point less the one before it, its first counted
      # from zero, the hour before the window giving each its point before.
      - uid: alasio-restores-falling-back
        title: Restores are falling back
        condition: falling
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ humanizePercentage $values.failed.Value }} of the restores from snapshots in the last hour fell back to bayma's checkpoints for a failure."
        data:
          - refId: failed
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: lake
            model:
              refId: failed
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select coalesce(sum(added) filter (where fallback in ('stale', 'node', 'prepare', 'restore', 'unreadable')), 0) / sum(added) as failed
                  from (
                    select TimeUnix, Attributes['alasio.sandbox.restore.fallback'] as fallback,
                      Value - coalesce(lag(Value) over (partition by ResourceAttributes, Attributes, StartTimeUnix order by TimeUnix), 0) as added
                    from otel.metrics_sum
                    where MetricName = 'alasio.sandbox.restores' and ServiceName = 'alasio-sandbox-gateway'
                      and TimeUnix > now()::timestamp - interval 2 hour
                  )
                  where TimeUnix > now()::timestamp - interval 1 hour and coalesce(fallback not in ('template', 'release'), true)
                  having sum(added) > 0
              root_selector: ""
              columns:
                - {selector: failed, text: failed, type: number}
          - refId: falling
            datasourceUid: __expr__
            model:
              refId: falling
              type: threshold
              expression: failed
              conditions: [{evaluator: {type: gt, params: [0.2]}}]

      # Of the sessions released in the last hour, the share whose release failed: its
      # sandbox's checkpoint failed while it runs on ("failed", tried again later), or once
      # it had ended it ("lost": its REPLs' live state is gone, the session resumed from
      # bayma's checkpoints), or the release failed beside it ("error", as a release whose
      # record could not be written, whose snapshot is then stale). One not snapshotted, as it
      # runs under no gVisor, is kept as designed and counts neither way. Counted as the
      # restores' alert counts.
      - uid: alasio-releases-failing
        title: Releases are failing
        condition: failing
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ humanizePercentage $values.failed.Value }} of the session releases in the last hour failed; a release whose sandbox ended unsaved lost its REPLs."
        data:
          - refId: failed
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: lake
            model:
              refId: failed
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select coalesce(sum(added) filter (where outcome in ('failed', 'lost', 'error')), 0) / sum(added) as failed
                  from (
                    select TimeUnix, Attributes['alasio.sandbox.release.outcome'] as outcome,
                      Value - coalesce(lag(Value) over (partition by ResourceAttributes, Attributes, StartTimeUnix order by TimeUnix), 0) as added
                    from otel.metrics_sum
                    where MetricName = 'alasio.sandbox.releases' and ServiceName = 'alasio-sandbox-gateway'
                      and TimeUnix > now()::timestamp - interval 2 hour
                  )
                  where TimeUnix > now()::timestamp - interval 1 hour and outcome != 'kept'
                  having sum(added) > 0
              root_selector: ""
              columns:
                - {selector: failed, text: failed, type: number}
          - refId: failing
            datasourceUid: __expr__
            model:
              refId: failing
              type: threshold
              expression: failed
              conditions: [{evaluator: {type: gt, params: [0.2]}}]

      # The folder conversations held, their instances' binds having failed three times in a
      # row: each runs its turns without bayma's REPL tools until its operator asks again. One
      # stuck folder is one operator's whole workspace, so any held alerts. Every gateway
      # replica counts the same record, so the greatest of each one's last count.
      - uid: alasio-folder-binds-failing
        title: Folder binds are failing
        condition: failing
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $values.held.Value }} folder conversations' bayma failed to start three times in a row: their turns run without its REPL tools until they are restarted (alasio status says why)."
        data:
          - refId: held
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: lake
            model:
              refId: held
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select max(last) as held
                  from (
                    select arg_max(Value, TimeUnix) as last
                    from otel.metrics_gauge
                    where MetricName = 'alasio.gateway.folders.failing' and ServiceName = 'alasio-sandbox-gateway'
                      and TimeUnix > now()::timestamp - interval 3 minute
                    group by ResourceAttributes['service.instance.id']
                  )
                  having count(*) > 0
              root_selector: ""
              columns:
                - {selector: held, text: held, type: number}
          - refId: failing
            datasourceUid: __expr__
            model:
              refId: failing
              type: threshold
              expression: held
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: alasio-replica-lagging
        title: A read replica trails its primary
        condition: lagging
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.compute }} has had {{ $values.bytes }} bytes of WAL yet to replay for fifteen minutes: the lake's loads from it trail alasio's writes."
        data:
          - refId: bytes
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: lake
            model:
              refId: bytes
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select Attributes['compute'] as compute, min(Value) as bytes
                  from otel.metrics_gauge
                  where MetricName = 'neon_control_replica_lag_bytes' and TimeUnix > now()::timestamp - interval 5 minute
                  group by 1
              root_selector: ""
              columns:
                - {selector: compute, text: compute, type: string}
                - {selector: bytes, text: bytes, type: number}
          - refId: lagging
            datasourceUid: __expr__
            model:
              refId: lagging
              type: threshold
              expression: bytes
              conditions: [{evaluator: {type: gt, params: [268435456]}}]

      # What of the stack's telemetry waits in the log for the lake's intake, as the intake
      # reports it by topic (lake_telemetry_lag_records): over four of its batches for ten
      # minutes, it does not keep up.
      - uid: alasio-telemetry-waiting
        title: Telemetry waits in the log
        condition: behind
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $values.waiting }} records of the stack's telemetry wait in the log for the lake's intake, more than four of its batches: it does not keep up. Let it run more replicas, lake.intake.scaling's max, which the log's topics take as many partitions as."
        data:
          - refId: waiting
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: lake
            model:
              refId: waiting
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select sum(waiting) as waiting from (
                    select Attributes['topic'] as topic, arg_max(Value, TimeUnix) as waiting
                    from otel.metrics_gauge
                    where ServiceName = 'lake-intake' and MetricName = 'lake_telemetry_lag_records' and TimeUnix > now()::timestamp - interval 5 minute
                    group by 1)
                  having count(*) > 0
              root_selector: ""
              columns:
                - {selector: waiting, text: waiting, type: number}
          - refId: behind
            datasourceUid: __expr__
            model:
              refId: behind
              type: threshold
              expression: waiting
              conditions: [{evaluator: {type: gt, params: [8000]}}]

      # How long the log keeps each telemetry partition's records in fact, as the lake's intake
      # says it (lake_telemetry_log_kept_seconds), against how long it is to
      # (lake_telemetry_log_retention_seconds, log.retention). A partition whose share of the
      # log's volume runs out first deletes by size before age, and keeps less, so that a restore
      # of the filer store's oldest backup can no longer have the lake refilled from the log. One
      # deleting by age keeps its retention, within the hour a segment closes within; one the log
      # has deleted none of is not said, as a young log holds less than its retention.
      - uid: alasio-log-keeps-less
        title: The log keeps less telemetry than its retention
        condition: shorter
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "The log keeps {{ $values.short }} h less of a telemetry topic's records than log.retention says: its share of the log's volume, three quarters of log.storage.size split across the telemetry topics' partitions, runs out first, so a restore of the filer store's oldest backup cannot have the lake refilled from the log. Give the log a larger volume, or keep less."
        data:
          - refId: short
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: lake
            model:
              refId: short
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select round((retention - kept) / 3600, 1) as short from
                    (select min(kept) as kept from (
                      select Attributes['topic'] as topic, Attributes['partition'] as partition, arg_max(Value, TimeUnix) as kept
                      from otel.metrics_gauge
                      where ServiceName = 'lake-intake' and MetricName = 'lake_telemetry_log_kept_seconds' and TimeUnix > now()::timestamp - interval 15 minute
                      group by 1, 2)),
                    (select arg_max(Value, TimeUnix) as retention
                      from otel.metrics_gauge
                      where ServiceName = 'lake-intake' and MetricName = 'lake_telemetry_log_retention_seconds' and TimeUnix > now()::timestamp - interval 15 minute)
                  where kept is not null and retention is not null
              root_selector: ""
              columns:
                - {selector: short, text: short, type: number}
          - refId: shorter
            datasourceUid: __expr__
            model:
              refId: shorter
              type: threshold
              expression: short
              conditions: [{evaluator: {type: gt, params: [1]}}]

      - uid: alasio-webhook-certificate-expiring
        title: The webhook's certificate nears its end
        condition: expiring
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "The certificate Telegram trusts for the webhook intake ends in {{ $values.days }} days, after which no bot's updates reach alasio: run alasio up, which renews it and registers each bot with the new one."
        data:
          - refId: days
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: lake
            model:
              refId: days
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select round((arg_max(Value, TimeUnix) - epoch(now())) / 86400, 1) as days
                  from otel.metrics_gauge
                  where ServiceName = 'webhook' and MetricName = 'webhook_certificate_expiry_timestamp_seconds' and TimeUnix > now()::timestamp - interval 10 minute
                  having count(*) > 0
              root_selector: ""
              columns:
                - {selector: days, text: days, type: number}
          - refId: expiring
            datasourceUid: __expr__
            model:
              refId: expiring
              type: threshold
              expression: days
              conditions: [{evaluator: {type: lt, params: [21]}}]

      # Whether Telegram's deliveries to the webhook intake fail, as alasio asks Telegram
      # every five minutes (src/telegram/delivery-watch.ts): updates wait, and its last
      # delivery failed lately. Telegram says so in getWebhookInfo alone, and no update
      # reaches alasio meanwhile. Five minutes of it are two asks that found it so.
      - uid: alasio-deliveries-failing
        title: Telegram's deliveries are failing
        condition: failing
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "Telegram has not delivered the bot's updates to the webhook intake for five minutes: they wait at Telegram. alasio's log says Telegram's error, as alasio status does, with its fix; where Telegram cannot connect, its networks may have changed from those install.webhook.sources lists (core.telegram.org/bots/webhooks)."
        data:
          - refId: deliveries
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: lake
            model:
              refId: deliveries
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select arg_max(Value, TimeUnix) as failing
                  from otel.metrics_gauge
                  where MetricName = 'alasio.telegram.deliveries.failing' and ServiceName = 'alasio' and ResourceAttributes['alasio.branch'] is null
                    and TimeUnix > now()::timestamp - interval 10 minute
                  having count(*) > 0
              root_selector: ""
              columns:
                - {selector: failing, text: failing, type: number}
          - refId: failing
            datasourceUid: __expr__
            model:
              refId: failing
              type: threshold
              expression: deliveries
              conditions: [{evaluator: {type: gt, params: [0]}}]

      - uid: alasio-lake-files-lost
        title: The lake names files the object store does not hold
        condition: lost
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $values.failed }} of the lake's maintenance passes failed in the last two hours on a file its catalog names that the object store does not hold: what it wrote since a backup put back, or a file deleted. Find why, then run alasio lake reconcile, which forgets them, loads what the transcripts lost again from alasio's database, and says what telemetry was lost."
        data:
          - refId: failed
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: lake
            model:
              refId: failed
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select count(*) as failed
                  from otel.logs
                  where ServiceName = 'alasio-lake-maintenance' and LogAttributes['because'] is not null and Timestamp > now()::timestamp - interval 2 hour
              root_selector: ""
              columns:
                - {selector: failed, text: failed, type: number}
          - refId: lost
            datasourceUid: __expr__
            model:
              refId: lost
              type: threshold
              expression: failed
              conditions: [{evaluator: {type: gt, params: [0]}}]

      # Pods the sandbox pods' policy refused to let be made in a sessions' namespace in the
      # last fifteen minutes, as the sandbox gateway counts them: a pool's template the policy
      # no longer admits, as after an upgrade that changed one and not the other, so its pool
      # never warms and no session binds.
      - uid: alasio-pod-policy-refusing
        title: The sandbox pods' policy refuses pods
        condition: refusing
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "The sandbox pods' policy refused {{ $values.refused.Value }} pods in the last fifteen minutes: a pool whose pods it refuses never warms, and its sessions bind nowhere."
        data:
          - refId: refused
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: lake
            model:
              refId: refused
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select coalesce(sum(added), 0) as refused
                  from (
                    select TimeUnix, Value - coalesce(lag(Value) over (partition by ResourceAttributes, Attributes, StartTimeUnix order by TimeUnix), 0) as added
                    from otel.metrics_sum
                    where MetricName = 'alasio.gateway.pod_policy.refusals' and ServiceName = 'alasio-sandbox-gateway'
                      and TimeUnix > now()::timestamp - interval 2 hour
                  )
                  where TimeUnix > now()::timestamp - interval 15 minute
              root_selector: ""
              columns:
                - {selector: refused, text: refused, type: number}
          - refId: refusing
            datasourceUid: __expr__
            model:
              refId: refusing
              type: threshold
              expression: refused
              conditions: [{evaluator: {type: gt, params: [0]}}]

      # How long the sandbox gateway's warm binds took in the last half hour, on average: a
      # free pod claimed at once, its workspace attached, and its bayma serving. Slow, the node
      # agents' attaches or bayma's start keep every session's first request waiting. Cold
      # binds, which wait for their pool to scale, and those whose pod is made, as a restore,
      # count neither way, nor the conversations' harnesses', whose host starts as they bind.
      - uid: alasio-binds-slow
        title: Binds are slow
        condition: slow
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "The sandbox gateway's binds of a free pod took {{ humanizeDuration $values.seconds.Value }} on average in the last half hour: each session's first request waits that long."
        data:
          - refId: seconds
            relativeTimeRange: {from: 7200, to: 0}
            datasourceUid: lake
            model:
              refId: seconds
              type: json
              source: url
              parser: backend
              format: table
              url: /query
              url_options:
                method: POST
                body_type: raw
                body_content_type: text/plain
                data: |
                  select sum(added_sum) / sum(added_count) as seconds
                  from (
                    select TimeUnix, Attributes['alasio.binder.start'] as start,
                      Sum - coalesce(lag(Sum) over series, 0) as added_sum,
                      Count::bigint - coalesce(lag(Count::bigint) over series, 0) as added_count
                    from otel.metrics_histogram
                    where MetricName = 'alasio.binder.bind.duration' and ServiceName = 'alasio-sandbox-gateway'
                      and coalesce(Attributes['alasio.binder.pool'], '') not like 'harness-%'
                      and TimeUnix > now()::timestamp - interval 2 hour
                    window series as (partition by ResourceAttributes, Attributes, StartTimeUnix order by TimeUnix)
                  )
                  where TimeUnix > now()::timestamp - interval 30 minute and start = 'warm'
                  having sum(added_count) > 0
              root_selector: ""
              columns:
                - {selector: seconds, text: seconds, type: number}
          - refId: slow
            datasourceUid: __expr__
            model:
              refId: slow
              type: threshold
              expression: seconds
              conditions: [{evaluator: {type: gt, params: [10]}}]
