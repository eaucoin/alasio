name: snapshot-bench-firecracker-probe

# A throwaway check of what a hosted runner offers Firecracker: KVM, userfaultfd, and one
# microVM booted, paused, snapshotted and restored.
on:
  push:
    branches: [spike/snapshot-bench-firecracker]
    paths: [.github/workflows/snapshot-bench-firecracker-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Host
        run: |
          uname -a; cat /etc/os-release | head -3; nproc; free -m; df -h / /mnt
          grep -m1 'model name' /proc/cpuinfo; grep -c -w -e vmx -e svm /proc/cpuinfo || true
          ls -l /dev/kvm /dev/userfaultfd || true
          sysctl vm.unprivileged_userfaultfd || true
          cat /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/defrag
          cat /sys/fs/cgroup/cgroup.controllers; stat -fc %T /sys/fs/cgroup
          echo "$ImageOS $ImageVersion"
      - name: KVM access
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Firecracker
        run: |
          curl -fsSL https://github.com/firecracker-microvm/firecracker/releases/download/v1.17.0/firecracker-v1.17.0-x86_64.tgz | tar -xz
          sudo install release-v1.17.0-x86_64/firecracker-v1.17.0-x86_64 /usr/local/bin/firecracker
          firecracker --version
          S3=https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/20261023-dd7c24b0d165-0/x86_64
          curl -fsSLo vmlinux "$S3/vmlinux-6.1.188"
          curl -fsSLo ubuntu.squashfs "$S3/ubuntu-24.04.squashfs"
          sha256sum vmlinux ubuntu.squashfs
          sudo apt-get install -y -qq squashfs-tools >/dev/null
          sudo unsquashfs -q -d root ubuntu.squashfs
          printf '#!/bin/sh\nmount -t proc proc /proc\necho probe-booted; cat /proc/meminfo | head -2\nwhile :; do echo tick $(cat /proc/uptime); sleep 1; done\n' | sudo tee root/probe-init >/dev/null
          sudo chmod +x root/probe-init
          truncate -s 1G rootfs.ext4 && sudo mkfs.ext4 -q -d root -F rootfs.ext4 && sudo chown "$USER" rootfs.ext4
      - name: Boot, pause, snapshot, restore
        run: |
          set -x
          api() { curl -fsS --unix-socket "$1" -X "$2" "http://localhost$3" -H 'Content-Type: application/json' ${4:+-d "$4"}; }
          firecracker --api-sock fc.sock > fc.log 2>&1 &
          sleep 0.5
          api fc.sock PUT /boot-source '{"kernel_image_path":"vmlinux","boot_args":"console=ttyS0 reboot=k panic=1 init=/probe-init"}'
          api fc.sock PUT /drives/rootfs '{"drive_id":"rootfs","path_on_host":"rootfs.ext4","is_root_device":true,"is_read_only":false}'
          api fc.sock PUT /machine-config '{"vcpu_count":2,"mem_size_mib":5120}'
          t0=$(date +%s%N); api fc.sock PUT /actions '{"action_type":"InstanceStart"}'
          for i in $(seq 100); do grep -q probe-booted fc.log && break; sleep 0.1; done
          echo "boot ms $(( ($(date +%s%N) - t0) / 1000000 ))"; sleep 3
          api fc.sock PATCH /vm '{"state":"Paused"}'
          t0=$(date +%s%N); api fc.sock PUT /snapshot/create '{"snapshot_type":"Diff","snapshot_path":"vm.state","mem_file_path":"vm.mem","sync_snapshot_files":false}'
          echo "diff snapshot ms $(( ($(date +%s%N) - t0) / 1000000 ))"
          t0=$(date +%s%N); api fc.sock PUT /snapshot/create '{"snapshot_type":"Full","snapshot_path":"full.state","mem_file_path":"full.mem","sync_snapshot_files":false}'
          echo "full snapshot ms $(( ($(date +%s%N) - t0) / 1000000 ))"
          ls -ls vm.mem full.mem vm.state; du -h vm.mem full.mem
          kill %1; wait || true; tail -5 fc.log
          firecracker --api-sock fc2.sock > fc2.log 2>&1 &
          sleep 0.5
          t0=$(date +%s%N); api fc2.sock PUT /snapshot/load '{"snapshot_path":"vm.state","mem_backend":{"backend_type":"File","backend_path":"vm.mem"},"resume_vm":true}'
          echo "load ms $(( ($(date +%s%N) - t0) / 1000000 ))"
          sleep 3; tail -5 fc2.log; kill %1 || true
