# AutoMQ 1.7.4 as 03 runs it, its bucket on SeaweedFS, for the log's restart gate
# (gate/log-restart/run.sh): one combined broker and KRaft controller, plaintext, a listener
# for the collector on the gate's network and one for the gate's counting on the runner.
process.roles=broker,controller
node.id=0
controller.quorum.voters=0@broker:9093
listeners=INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
advertised.listeners=INTERNAL://broker:9092,EXTERNAL://localhost:19092
listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=INTERNAL
controller.listener.names=CONTROLLER
log.dirs=/data/kraft
auto.create.topics.enable=false
log.retention.hours=24
s3.data.buckets=0@s3://log?region=us-east-1&endpoint=http://s3:8333&pathStyle=true
s3.ops.buckets=1@s3://log?region=us-east-1&endpoint=http://s3:8333&pathStyle=true
s3.wal.path=0@s3://log?region=us-east-1&endpoint=http://s3:8333&pathStyle=true
s3.stream.allocator.policy=POOLED_DIRECT
s3.wal.cache.size=524288000
s3.block.cache.size=104857600
s3.wal.upload.threshold=62914560
