name: ci

# On demand only, as an end-to-end run builds every image and brings clusters up.
on:
  workflow_dispatch:
    inputs:
      # Some of the end-to-end jobs alone, for a change that needs no more proven (the
      # shards job says which); the unit, package and images jobs run whatever it says.
      shards:
        description: "End-to-end jobs to run, each a shard, target/shard or target/agents/shard (all if empty)"
        type: string
        default: ""
      # The release the upgrade shard upgrades from, which an installation runs before it
      # upgrades to this: npm's latest, as the box's is, unless another is named.
      previous:
        description: "Release the upgrade shard upgrades from, as 8.0.0 (npm's latest if empty)"
        type: string
        default: ""

permissions:
  contents: read

env:
  # Where the images job pushes the images, once, for every end-to-end job to pull: under
  # run-<id>-<attempt>, packages of the attempt's own, which the last job deletes whole.
  # A package GitHub's token makes here is linked to this public repository, and public as
  # it is, so alasio init and the clusters' nodes pull them without a login.
  REGISTRY: ghcr.io/eaucoin/alasio-ci

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      # The lake's package installed too, as a checkout that builds its image has it: its
      # modules then resolve its own copies, which the root's tests must work beside.
      - run: npm ci --prefix neon/lake
      - run: npm run typecheck
      - run: npm test

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      # Builds the command line and packs its npm package; checks that the package holds
      # the built command line alone, with the CRD it applies; and runs alasio --version
      # and --help from an install of it.
      - run: node tooling/cli-package.ts

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      registry: ${{ steps.push.outputs.registry }}
      previous: ${{ steps.previous.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # For tooling/node-image.ts, which says the node image's pins, and npm, which says the
      # release the upgrade shard upgrades from.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - id: previous
        name: Say the release the upgrade shard upgrades from
        env:
          PREVIOUS: ${{ inputs.previous }}
        run: |
          previous=$(npm view "alasio@${PREVIOUS:-latest}" version)
          [[ $previous =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::npm names no one release of alasio by ${PREVIOUS:-latest}: ${previous:-none}"; exit 1; }
          echo "previous=$previous" | tee --append "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Pushes alasio's own images as eStargz (tooling/push-estargz.sh), which the clusters
      # the end-to-end runs make pull lazily.
      - uses: docker/setup-buildx-action@v3
      # All seven at once, each line said with its image's name, the node image with its pins
      # (tooling/node-image.ts), whole, as Docker runs it, and on alasio's,
      # alasio-harness-stand-ins, which the end-to-end runs install
      # (test/e2e/harness-stand-ins.Dockerfile); and the stand-ins again, as
      # alasio-harness-stand-ins-previous, on the published alasio image of the release the
      # upgrade shard upgrades from; the step fails if any did.
      - id: push
        name: Build and push the images
        shell: bash
        env:
          PUSH_TO: ${{ env.REGISTRY }}/run-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE: https://github.com/${{ github.repository }}
          PREVIOUS: ${{ steps.previous.outputs.previous }}
        run: |
          declare -A pids
          for image in "alasio:." "alasio-agent:sandbox/agent" "alasio-lake:neon/lake" "alasio-grafana:neon/grafana" "alasio-log:neon/log" "alasio-collector:neon/collector" "alasio-webhook:webhook" "alasio-node:cluster/node" "alasio-harness-stand-ins-previous:test"; do
            name=${image%%:*}
            {
              if [ "$name" = alasio-node ]; then
                mapfile -t args < <(node tooling/node-image.ts)
                docker build "${args[@]}" --tag "$PUSH_TO/$name:e2e" --label "org.opencontainers.image.source=$SOURCE" "${image#*:}" &&
                  docker push "$PUSH_TO/$name:e2e"
              elif [ "$name" = alasio-harness-stand-ins-previous ]; then
                tooling/push-estargz.sh "$PUSH_TO/$name:e2e" test --file test/e2e/harness-stand-ins.Dockerfile \
                  --build-arg "ALASIO=ghcr.io/eaucoin/alasio:$PREVIOUS" --label "org.opencontainers.image.source=$SOURCE"
              else
                tooling/push-estargz.sh "$PUSH_TO/$name:e2e" "${image#*:}" --label "org.opencontainers.image.source=$SOURCE" &&
                  if [ "$name" = alasio ]; then
                    tooling/push-estargz.sh "$PUSH_TO/alasio-harness-stand-ins:e2e" test --file test/e2e/harness-stand-ins.Dockerfile \
                      --build-arg "ALASIO=$PUSH_TO/alasio:e2e" --label "org.opencontainers.image.source=$SOURCE"
                  fi
              fi
            } 2>&1 | sed -u "s/^/$name: /" &
            pids[$name]=$!
          done
          failed=0
          for name in "${!pids[@]}"; do
            wait "${pids[$name]}" || { echo "::error::$name was not built and pushed"; failed=1; }
          done
          echo "registry=$PUSH_TO" >>"$GITHUB_OUTPUT"
          exit "$failed"

  # The end-to-end jobs, each a shard of the suites on a cluster: in Docker on one node,
  # and on a server with two agents, so the stack and sessions spread; and k3s on the
  # runner itself, the host target, which the runner's sudo, asking for no password, lets
  # alasio install, on one: behind ufw for one shard, as a server often is, and without a
  # firewall for the others. The shards need nothing of each other's: alasio on
  # Kubernetes, workspaces on JuiceFS, Neon, alasio's telemetry, branch environments, and
  # how alasio is scaled, sized and drained, sessions' whole-sandbox snapshots, and, on the
  # host target alone, as the box's, alasio upgraded from the release before
  # (test/e2e/harness.ts). All of them, or those the run's shards input names, each word of
  # it a shard on every cluster, target/shard on its target's, or target/agents/shard on
  # one; a word that names none fails the run before any starts.
  shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        name: Say the end-to-end jobs
        shell: bash
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          matrix=$(jq --null-input --raw-output --arg shards "$SHARDS" '
            def name($parts):
              if $parts == 1 then [.shard] elif $parts == 2 then [.target, .shard]
              else [.target, (.agents | tostring), .shard] end;
            def named($word): ($word | split("/")) as $parts | name($parts | length) == $parts;
            [({target: "docker", agents: (0, 2)}, {target: "host", agents: 0}) as $cluster
              | ("sessions", "workspaces", "neon", "telemetry", "branches", "scaling", "snapshots", "upgrade") as $shard
              | $cluster + {shard: $shard}
              | select(.shard != "upgrade" or .target == "host")
              | if .target == "host" and .shard == "sessions" then . + {firewall: "ufw"} else . end]
            | . as $jobs
            | [$shards | splits("[\\s,]+") | select(. != "")] as $words
            | [$words[] | select(. as $word | $jobs | any(named($word)) | not)] as $unnamed
            | if $unnamed != [] then
                "::error::shards names no end-to-end job by \($unnamed | join(", "))\n" | halt_error(1)
              elif $words == [] then .
              else map(select(any(named($words[]); .))) end
            | "matrix=\({include: .} | tojson)"')
          echo "$matrix" | tee --append "$GITHUB_OUTPUT"

  e2e:
    needs: [shards, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shards.outputs.matrix) }}
    steps:
      # The cluster holds Neon's images and the agent image, bayma's with every runtime
      # it serves, unpacked: far more disk than a runner starts with free, so the
      # software it comes with that this job does not use goes first. Each directory is
      # moved aside, as setup-node installs Node in a tool cache made anew, then removed,
      # and Docker's images pruned, all at once, in the background, while the job readies
      # the run; the step before the run waits for it.
      - name: Free disk space, in the background
        shell: bash
        run: |
          dirs=(/usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
            /usr/local/share/chromium /usr/local/lib/heroku /opt/microsoft /opt/google /opt/az)
          for dir in "${dirs[@]}"; do
            [ ! -e "$dir" ] || sudo mv "$dir" "$dir.deleted"
          done
          (
            pids=()
            for dir in "${dirs[@]}"; do
              sudo rm -rf "$dir.deleted" &
              pids+=($!)
            done
            docker system prune --all --force &
            pids+=($!)
            status=0
            for pid in "${pids[@]}"; do wait "$pid" || status=1; done
            echo "$status" >"$RUNNER_TEMP/disk-freed.part" && mv "$RUNNER_TEMP/disk-freed.part" "$RUNNER_TEMP/disk-freed"
          ) >"$RUNNER_TEMP/disk-freed.log" 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - name: Wait for the disk space
        run: |
          until [ -f "$RUNNER_TEMP/disk-freed" ]; do sleep 1; done
          cat "$RUNNER_TEMP/disk-freed.log"
          df -h /
          exit "$(cat "$RUNNER_TEMP/disk-freed")"
      # ufw active, denying all that comes in, as alasio finds it on a server: alasio lets the
      # cluster's networks in (cli/src/cluster/node.ts), and its rules, said now, are to be
      # the same once alasio is removed.
      - name: Enable ufw, denying what comes in
        if: matrix.firewall == 'ufw'
        run: |
          command -v ufw >/dev/null || sudo apt-get install --yes ufw
          sudo ufw default deny incoming
          sudo ufw default allow outgoing
          sudo ufw --force enable
          sudo ufw status verbose
          sudo ufw show added | tee "$RUNNER_TEMP/ufw-rules"
      # alasio's package installed, alasio init and up on a cluster of this runner from the
      # images job's images, the shard's end-to-end tests, and alasio uninstall --purge,
      # which leaves nothing of the cluster on the runner (test/e2e/harness.ts).
      - run: npm run test:e2e
        env:
          ALASIO_E2E_TARGET: ${{ matrix.target }}
          ALASIO_E2E_AGENTS: ${{ matrix.agents }}
          ALASIO_E2E_SHARD: ${{ matrix.shard }}
          ALASIO_E2E_REGISTRY: ${{ needs.images.outputs.registry }}
          ALASIO_E2E_PREVIOUS: ${{ needs.images.outputs.previous }}
      - name: ufw's rules are as they were before alasio
        if: matrix.firewall == 'ufw'
        run: |
          sudo ufw status verbose
          sudo ufw show added | diff "$RUNNER_TEMP/ufw-rules" -

  # Whatever came of the rest, the run's images are deleted, those of each of its attempts,
  # pushed whole or not; so a failed run is re-run whole, its images built anew, as a
  # re-run of its failed jobs alone would find them gone.
  delete-images:
    needs: [images, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete the run's images
        shell: bash
        run: |
          failed=0
          for attempt in $(seq "$GITHUB_RUN_ATTEMPT"); do
            for name in alasio alasio-agent alasio-lake alasio-grafana alasio-log alasio-collector alasio-webhook alasio-node alasio-harness-stand-ins alasio-harness-stand-ins-previous; do
              image="$REGISTRY/run-$GITHUB_RUN_ID-$attempt/$name"
              package="alasio-ci/run-$GITHUB_RUN_ID-$attempt/$name"
              if said=$(gh api --method DELETE "/users/eaucoin/packages/container/${package//\//%2F}" 2>&1); then
                echo "deleted $image"
              elif [[ $said == *"HTTP 404"* ]]; then
                echo "no $image to delete"
              else
                echo "::error::$image was not deleted: $said"
                failed=1
              fi
            done
          done
          exit "$failed"
