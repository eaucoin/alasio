name: gate-log-restart

# The log's restart gate, 03's (gate/log-restart/run.sh): which log keeps every record it
# acknowledged through its broker's restarts, each way a broker stops: AutoMQ with the
# collector's idempotent producer, AutoMQ with a plain one, and Apache Kafka 4.2 with the
# idempotent one, its segments on its volume, or tiered to SeaweedFS. On its branch alone,
# whenever what it runs changes.
on:
  push:
    branches: [track/log-restart-gate]
    paths: [.github/workflows/gate-log-restart.yml, gate/log-restart/**]
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds a job, each its broker stopped one way, the three ways in turn"
        type: string
        default: "18"

permissions:
  contents: read

jobs:
  restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { broker: automq, producer: idempotent }
          - { broker: automq, producer: plain }
          - { broker: kafka, producer: idempotent }
          - { broker: kafka-tiered, producer: idempotent }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: gate/log-restart/run.sh
        env:
          BROKER: ${{ matrix.broker }}
          PRODUCER: ${{ matrix.producer }}
          ROUNDS: ${{ inputs.rounds || '18' }}
          OUT: ${{ runner.temp }}/gate-log-restart
      - if: always()
        run: |
          for name in broker collector s3; do docker logs "$name" >"$RUNNER_TEMP/gate-log-restart/$name-final.log" 2>&1 || true; done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log-restart-${{ matrix.broker }}-${{ matrix.producer }}
          path: ${{ runner.temp }}/gate-log-restart
