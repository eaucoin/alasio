suite: security
templates:
  - templates/networkpolicies.yaml
  - templates/alasio/namespaces.yaml
  - templates/alasio/rbac.yaml
set:
  alasio.telegram.existingSecret: telegram
tests:
  - it: enforces Pod Security restricted in the sessions namespace
    template: templates/alasio/namespaces.yaml
    asserts:
      - equal: { path: 'metadata.labels["pod-security.kubernetes.io/enforce"]', value: restricted }
      - hasDocuments: { count: 1 }
  - it: makes the privileged host namespace only with the host profile
    template: templates/alasio/namespaces.yaml
    set:
      host.enabled: true
    asserts:
      - hasDocuments: { count: 2 }
      - equal: { path: 'metadata.labels["pod-security.kubernetes.io/enforce"]', value: privileged }
        documentIndex: 1
  - it: denies everything in the sessions namespace but bayma from alasio and telemetry to it
    template: templates/networkpolicies.yaml
    asserts:
      - equal: { path: spec.policyTypes, value: [Ingress, Egress] }
        documentSelector: { path: metadata.name, value: default-deny }
      - equal: { path: spec.podSelector, value: {} }
        documentSelector: { path: metadata.name, value: default-deny }
      - equal: { path: 'spec.ingress[0].ports', value: [{ protocol: TCP, port: 7290 }] }
        documentSelector: { path: metadata.name, value: bayma-from-alasio }
      - equal: { path: 'spec.egress[0].ports', value: [{ protocol: TCP, port: 4318 }] }
        documentSelector: { path: metadata.name, value: telemetry-to-alasio }
  - it: keeps a session with internet off private, link-local and metadata addresses
    template: templates/networkpolicies.yaml
    documentSelector: { path: metadata.name, value: full-internet }
    asserts:
      - equal: { path: 'spec.podSelector.matchLabels["alasio.dev/net-mode"]', value: full }
      - contains: { path: 'spec.egress[0].to[0].ipBlock.except', content: 10.0.0.0/8 }
      - contains: { path: 'spec.egress[0].to[0].ipBlock.except', content: 169.254.0.0/16 }
      - contains: { path: 'spec.egress[0].to[0].ipBlock.except', content: 100.64.0.0/10 }
  - it: renders no policies when they are turned off
    template: templates/networkpolicies.yaml
    set:
      networkPolicies.enabled: false
    asserts:
      - hasDocuments: { count: 0 }
  - it: lets alasio manage only Sandboxes, their token Secrets and exec in its namespaces
    template: templates/alasio/rbac.yaml
    documentSelector: { path: kind, value: Role }
    asserts:
      - equal: { path: metadata.namespace, value: alasio-sessions }
      - equal:
          path: rules
          value:
            - { apiGroups: [agents.x-k8s.io], resources: [sandboxes], verbs: [get, list, watch, create, patch, delete] }
            - { apiGroups: [""], resources: [secrets], verbs: [get, create] }
            - { apiGroups: [""], resources: [pods], verbs: [get] }
            - { apiGroups: [""], resources: [pods/exec], verbs: [create, get] }
  - it: lets the host profile's agents restart alasio's own Deployment and nothing else
    template: templates/alasio/rbac.yaml
    set:
      host.enabled: true
    documentSelector: { path: 'rules[0].apiGroups[0]', value: apps }
    asserts:
      - equal: { path: metadata.name, value: RELEASE-NAME-alasio-restart }
      - equal:
          path: rules[0]
          value: { apiGroups: [apps], resources: [deployments], resourceNames: [RELEASE-NAME-alasio], verbs: [get, patch] }
