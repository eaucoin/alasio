# The release the end-to-end run installs: small volumes, and requests small enough that
# the whole of alasio, its sessions and Neon schedule on a CI runner's two CPUs.
alasio:
  telegram:
    existingSecret: alasio-telegram
  env:
    TELEGRAM_API_ROOT: http://telegram.alasio-test.svc:8081
  persistence: { size: 2Gi }
  resources: { requests: { cpu: 50m, memory: 256Mi } }
telemetry:
  otlpEndpoint: http://otlp.alasio-test.svc:4318
# The host profile, on the node's /tmp as the operator's home, which any user may write.
host:
  enabled: true
  uid: 1000
  gid: 1000
  home: /work
  stateRoot: /work/.alasio/bayma
  workspaceRoot: /work
  mounts:
    - { name: work, hostPath: /tmp, mountPath: /work, type: Directory }
  resources: { requests: { cpu: 20m, memory: 128Mi } }
sessions:
  storage: { size: 1Gi }
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: "1", memory: 1Gi } }
neon:
  safekeepers:
    storage: { size: 2Gi }
    resources: { requests: { cpu: 20m, memory: 64Mi } }
  pageserver:
    storage: { size: 5Gi }
    resources: { requests: { cpu: 50m, memory: 128Mi } }
  storageController: { resources: { requests: { cpu: 10m, memory: 64Mi } } }
  storageBroker: { resources: { requests: { cpu: 10m, memory: 32Mi } } }
  controllerDb: { resources: { requests: { cpu: 10m, memory: 64Mi } } }
  control: { resources: { requests: { cpu: 10m, memory: 32Mi } } }
  compute: { resources: { requests: { cpu: 50m, memory: 256Mi } } }
  collector: { resources: { requests: { cpu: 10m, memory: 64Mi } } }
objectStore:
  bundled:
    storage: { size: 10Gi }
    volumes: 30
    # A runner's disk is mostly images; the store needs only a little of what is left.
    minFreeSpace: 1GiB
    resources: { requests: { cpu: 20m, memory: 128Mi } }
lake:
  resources: { requests: { cpu: 20m, memory: 256Mi } }
agent-sandbox:
  resources: { requests: { cpu: 10m, memory: 32Mi } }
