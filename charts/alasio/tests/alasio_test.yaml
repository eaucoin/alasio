suite: alasio
templates:
  - templates/alasio/deployment.yaml
  - templates/alasio/sandbox-templates.yaml
set:
  alasio.telegram.existingSecret: telegram
tests:
  - it: refuses to render without the Telegram Secret
    set:
      alasio.telegram.existingSecret: ""
    template: templates/alasio/deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: telegram/existingSecret
  - it: runs one alasio at a time, never two
    template: templates/alasio/deployment.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - equal: { path: spec.replicas, value: 1 }
      - equal: { path: spec.strategy.type, value: Recreate }
  - it: drives Kubernetes from the rendered templates, with its state on its own volume
    template: templates/alasio/deployment.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: ALASIO_KUBE_TEMPLATES, value: /etc/alasio/templates.json }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: ALASIO_STATE_DIR, value: /var/lib/alasio/state }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: HOME, value: /var/lib/alasio/home }
      - contains:
          path: spec.template.spec.volumes
          content: { name: state, persistentVolumeClaim: { claimName: RELEASE-NAME-alasio } }
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
  - it: keeps its volume when the release is uninstalled
    template: templates/alasio/deployment.yaml
    documentSelector: { path: kind, value: PersistentVolumeClaim }
    asserts:
      - equal: { path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep }
  - it: uses an existing claim instead of making one
    template: templates/alasio/deployment.yaml
    set:
      alasio.persistence.existingClaim: mine
    asserts:
      - hasDocuments: { count: 2 }
      - contains:
          path: spec.template.spec.volumes
          content: { name: state, persistentVolumeClaim: { claimName: mine } }
        documentSelector: { path: kind, value: Deployment }
  - it: gives Claude Code its token from a Secret only when one is named
    template: templates/alasio/deployment.yaml
    documentSelector: { path: kind, value: Deployment }
    set:
      alasio.claude.existingSecret: claude
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: CLAUDE_CODE_OAUTH_TOKEN, valueFrom: { secretKeyRef: { name: claude, key: token } } }
  - it: runs as the operator, in their home, with their mounts, under the host profile
    template: templates/alasio/deployment.yaml
    documentSelector: { path: kind, value: Deployment }
    set:
      host.enabled: true
      host.uid: 1234
      host.gid: 1235
      host.supplementalGroups: [999]
      host.home: /home/op
      host.mounts:
        - { name: home, hostPath: /home, mountPath: /home }
    asserts:
      - equal: { path: spec.template.spec.securityContext.runAsUser, value: 1234 }
      - equal: { path: spec.template.spec.securityContext.supplementalGroups, value: [999] }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: HOME, value: /home/op }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: home, mountPath: /home }
      - contains:
          path: spec.template.spec.volumes
          content: { name: home, hostPath: { path: /home } }
  - it: renders sessions under gVisor with the egress gate, and no host profile by default
    template: templates/alasio/sandbox-templates.yaml
    asserts:
      - matchRegex: { path: 'data["templates.json"]', pattern: '"runtimeClassName": "gvisor"' }
      - matchRegex: { path: 'data["templates.json"]', pattern: '"egressGate": true' }
      - notMatchRegex: { path: 'data["templates.json"]', pattern: '"host":' }
  - it: renders sessions under the cluster's default runtime when asked
    template: templates/alasio/sandbox-templates.yaml
    set:
      sessions.runtimeClassName: ""
    asserts:
      - notMatchRegex: { path: 'data["templates.json"]', pattern: runtimeClassName }
  - it: renders the host profile's bayma with what it needs to snapshot its sessions
    template: templates/alasio/sandbox-templates.yaml
    set:
      host.enabled: true
      host.stateRoot: /home/op/.alasio/bayma
    asserts:
      - matchRegex: { path: 'data["templates.json"]', pattern: '"CHECKPOINT_RESTORE"' }
      - matchRegex: { path: 'data["templates.json"]', pattern: '"stateRoot": "/home/op/.alasio/bayma"' }
      - matchRegex: { path: 'data["templates.json"]', pattern: '"serviceAccountName": "RELEASE-NAME-alasio-host-agent"' }
  - it: restarts alasio when the templates change
    template: templates/alasio/deployment.yaml
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - exists: { path: 'spec.template.metadata.annotations["checksum/sandbox-templates"]' }
