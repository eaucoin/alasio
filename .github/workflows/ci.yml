name: ci

# Spike, not for main: the endpoint package's validation experiments of the orchestration
# area (E3, E4, E9, E10, E14, G-18, E8 = X-ZSWAP, X-OOM, X-ARM), on this throwaway branch
# alone: the branch's own ci.yml, as GitHub dispatches only workflows whose file is on the
# default branch. `experiments` names the jobs: orch and wake, end-to-end shards of alasio on
# the host target (test/e2e/orchestration.test.ts, the wake shard of test/e2e/alasio.test.ts);
# arm, uffd, zswap, oom and g18, raw runsc or the host's kernel on a runner (bench/val/).
on:
  workflow_dispatch:
    inputs:
      experiments:
        description: "Jobs, of orch wake arm uffd zswap oom g18"
        type: string
        default: "orch"
      orch-parts:
        description: "Parts of the orch shard, of restore density pause (all if empty)"
        type: string
        default: ""
      arm-parts:
        description: "Parts of the arm job, of carm prearm rates"
        type: string
        default: "carm prearm rates"
      zswap-args:
        description: "Arguments of the zswap job's bench/val/zswap.py beside --runsc and --out"
        type: string
        default: ""
      kernels:
        description: "Kernels of the uffd and oom jobs, of runner vm612"
        type: string
        default: "runner vm612"
      previous:
        description: "Release the images job's stand-ins of the release before are built on (npm's latest if empty)"
        type: string
        default: ""
      images:
        description: "alasio's images of an earlier run, kept, as ghcr.io/eaucoin/alasio-ci/run-<id>-<attempt> (built anew if empty)"
        type: string
        default: ""
      keep-images:
        description: "Keep the images this run builds, for later runs, to be deleted by hand"
        type: boolean
        default: false
      cpu:
        description: "The runner CPU model every job must have, others failing at once to be re-run (any if empty)"
        type: string
        default: "AMD EPYC 7763 64-Core Processor"
      kernel:
        description: "The prefix of the runner kernel's release every job must have (any if empty)"
        type: string
        default: "7.0."

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/eaucoin/alasio-ci
  GVISOR_RELEASE: 20260921.0-eaucoin.15

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.plan.outputs.e2e }}
      raw: ${{ steps.plan.outputs.raw }}
      arm: ${{ steps.plan.outputs.arm }}
      kernels: ${{ steps.plan.outputs.kernels }}
    steps:
      - id: plan
        name: Say the jobs
        shell: bash
        env:
          EXPERIMENTS: ${{ inputs.experiments }}
          KERNELS: ${{ inputs.kernels }}
        run: |
          words() { jq --raw-input --compact-output '[splits("[\\s,]+") | select(. != "")]' <<<"$1"; }
          all=$(words "$EXPERIMENTS")
          unknown=$(jq -r '[.[] | select(IN("orch", "wake", "arm", "uffd", "zswap", "oom", "g18") | not)] | join(", ")' <<<"$all")
          [ -z "$unknown" ] || { echo "::error::no experiment $unknown"; exit 1; }
          echo "e2e=$(jq -c '[.[] | select(IN("orch", "wake"))]' <<<"$all")" | tee -a "$GITHUB_OUTPUT"
          echo "raw=$(jq -c '[.[] | select(IN("orch", "wake") | not)]' <<<"$all")" | tee -a "$GITHUB_OUTPUT"
          echo "arm=$(jq -c 'if any(.[]; . == "arm") then ["systrap", "kvm"] else [] end' <<<"$all")" | tee -a "$GITHUB_OUTPUT"
          echo "kernels=$(words "$KERNELS")" | tee -a "$GITHUB_OUTPUT"

  images:
    needs: plan
    if: needs.plan.outputs.e2e != '[]' && inputs.images == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      registry: ${{ steps.push.outputs.registry }}
      previous: ${{ steps.previous.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # For tooling/node-image.ts, which says the node image's pins, and npm, which says the
      # release the upgrade shard upgrades from.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - id: previous
        name: Say the release the upgrade shard upgrades from
        env:
          PREVIOUS: ${{ inputs.previous }}
        run: |
          previous=$(npm view "alasio@${PREVIOUS:-latest}" version)
          [[ $previous =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::npm names no one release of alasio by ${PREVIOUS:-latest}: ${previous:-none}"; exit 1; }
          echo "previous=$previous" | tee --append "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Pushes alasio's own images whole (tooling/push-whole.sh), as the release does, but the
      # sessions' agent image, as eStargz (tooling/push-estargz.sh), which the clusters the
      # end-to-end runs make pull lazily.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # All seven at once, each line said with its image's name, the node image with its pins
      # (tooling/node-image.ts), whole, as Docker runs it, and on alasio's,
      # alasio-harness-stand-ins, which the end-to-end runs install
      # (test/e2e/harness-stand-ins.Dockerfile); and the stand-ins again, as
      # alasio-harness-stand-ins-previous, on the published alasio image of the release the
      # upgrade shard upgrades from; the step fails if any did.
      - id: push
        name: Build and push the images
        shell: bash
        env:
          PUSH_TO: ${{ env.REGISTRY }}/run-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE: https://github.com/${{ github.repository }}
          PREVIOUS: ${{ steps.previous.outputs.previous }}
        run: |
          declare -A pids
          for image in "alasio:." "alasio-agent:sandbox/agent" "alasio-lake:neon/lake" "alasio-grafana:neon/grafana" "alasio-log:neon/log" "alasio-collector:neon/collector" "alasio-webhook:webhook" "alasio-node:cluster/node" "alasio-harness-stand-ins-previous:test"; do
            name=${image%%:*}
            {
              if [ "$name" = alasio-node ]; then
                mapfile -t args < <(node tooling/node-image.ts)
                docker build "${args[@]}" --tag "$PUSH_TO/$name:e2e" --label "org.opencontainers.image.source=$SOURCE" "${image#*:}" &&
                  docker push "$PUSH_TO/$name:e2e"
              elif [ "$name" = alasio-harness-stand-ins-previous ]; then
                tooling/push-estargz.sh "$PUSH_TO/$name:e2e" test --file test/e2e/harness-stand-ins.Dockerfile \
                  --build-arg "ALASIO=ghcr.io/eaucoin/alasio:$PREVIOUS" --label "org.opencontainers.image.source=$SOURCE"
              else
                # alasio's own, with the commit it is built from, which its telemetry says.
                revision=()
                if [ "$name" = alasio ]; then revision=(--build-arg "REVISION=$GITHUB_SHA"); fi
                # Whole, as the release pushes them, but the agent's, lazily pulled: the stand-ins on alasio's among them,
                # which the runs install as alasio's.
                push=tooling/push-whole.sh
                if [ "$name" = alasio-agent ]; then push=tooling/push-estargz.sh; fi
                "$push" "$PUSH_TO/$name:e2e" "${image#*:}" "${revision[@]}" --label "org.opencontainers.image.source=$SOURCE" &&
                  if [ "$name" = alasio ]; then
                    tooling/push-whole.sh "$PUSH_TO/alasio-harness-stand-ins:e2e" test --file test/e2e/harness-stand-ins.Dockerfile \
                      --build-arg "ALASIO=$PUSH_TO/alasio:e2e" --label "org.opencontainers.image.source=$SOURCE"
                  fi
              fi
            } 2>&1 | sed -u "s/^/$name: /" &
            pids[$name]=$!
          done
          failed=0
          for name in "${!pids[@]}"; do
            wait "${pids[$name]}" || { echo "::error::$name was not built and pushed"; failed=1; }
          done
          echo "registry=$PUSH_TO" >>"$GITHUB_OUTPUT"
          exit "$failed"


  e2e:
    needs: [plan, images]
    if: always() && needs.plan.outputs.e2e != '[]' && (needs.images.result == 'success' || inputs.images != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.e2e) }}
    steps:
      - name: The runner's CPU and kernel, as pinned
        shell: bash
        env:
          PINNED_CPU: ${{ inputs.cpu }}
          PINNED_KERNEL: ${{ inputs.kernel }}
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)
          echo "CPU $model, kernel $(uname -r), $(nproc) cores, $(free -g | awk '/Mem:/ { print $2 }') GiB"
          [ -z "$PINNED_CPU" ] || [ "$model" = "$PINNED_CPU" ] || { echo "::error::this runner's CPU is $model, not $PINNED_CPU: re-run this job"; exit 3; }
          [ -z "$PINNED_KERNEL" ] || [[ $(uname -r) == "$PINNED_KERNEL"* ]] || { echo "::error::this runner's kernel is $(uname -r), not $PINNED_KERNEL*: re-run this job"; exit 3; }
      - name: Free disk space, in the background
        shell: bash
        run: |
          dirs=(/usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
            /usr/local/share/chromium /usr/local/lib/heroku /opt/microsoft /opt/google /opt/az)
          for dir in "${dirs[@]}"; do
            [ ! -e "$dir" ] || sudo mv "$dir" "$dir.deleted"
          done
          (
            pids=()
            for dir in "${dirs[@]}"; do
              sudo rm -rf "$dir.deleted" &
              pids+=($!)
            done
            docker system prune --all --force &
            pids+=($!)
            status=0
            for pid in "${pids[@]}"; do wait "$pid" || status=1; done
            echo "$status" >"$RUNNER_TEMP/disk-freed.part" && mv "$RUNNER_TEMP/disk-freed.part" "$RUNNER_TEMP/disk-freed"
          ) >"$RUNNER_TEMP/disk-freed.log" 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - name: Wait for the disk space
        run: |
          until [ -f "$RUNNER_TEMP/disk-freed" ]; do sleep 1; done
          cat "$RUNNER_TEMP/disk-freed.log"
          df -h /
          exit "$(cat "$RUNNER_TEMP/disk-freed")"
      - name: The ${{ matrix.shard }} shard, on the host target
        shell: bash
        env:
          ALASIO_E2E_TARGET: host
          ALASIO_E2E_AGENTS: "0"
          ALASIO_E2E_SHARD: ${{ matrix.shard }}
          ALASIO_E2E_REGISTRY: ${{ inputs.images || needs.images.outputs.registry }}
          ALASIO_E2E_PREVIOUS: ${{ needs.images.outputs.previous }}
          ORCH_PARTS: ${{ inputs.orch-parts }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if [ "$ALASIO_E2E_SHARD" = orch ]; then
            node --test --test-timeout=10800000 --test-force-exit --test-reporter=spec test/e2e/orchestration.test.ts 2>&1 | tee "$RUNNER_TEMP/out/orch.log"
          else
            npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/out/$ALASIO_E2E_SHARD.log"
          fi
          exit "${PIPESTATUS[0]}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: val-e2e-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn

  delete-images:
    needs: [images, e2e]
    if: always() && needs.images.result == 'success' && !inputs.keep-images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete the run's images
        shell: bash
        run: |
          failed=0
          for attempt in $(seq "$GITHUB_RUN_ATTEMPT"); do
            for name in alasio alasio-agent alasio-lake alasio-grafana alasio-log alasio-collector alasio-webhook alasio-node alasio-harness-stand-ins alasio-harness-stand-ins-previous; do
              package="alasio-ci/run-$GITHUB_RUN_ID-$attempt/$name"
              if said=$(gh api --method DELETE "/users/eaucoin/packages/container/${package//\//%2F}" 2>&1); then
                echo "deleted $package"
              elif [[ $said == *"HTTP 404"* ]]; then
                echo "no $package to delete"
              else
                echo "::error::$package was not deleted: $said"
                failed=1
              fi
            done
          done
          exit "$failed"

  # X-ARM (G-19, G-20 as built, G-22, G-24): bench/val/arm.py, on systrap and kvm.
  arm:
    needs: plan
    if: needs.plan.outputs.arm != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.arm) }}
    steps:
      - name: The runner's CPU and kernel, as pinned
        shell: bash
        env:
          PINNED_CPU: ${{ inputs.cpu }}
          PINNED_KERNEL: ${{ inputs.kernel }}
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)
          echo "CPU $model, kernel $(uname -r), $(nproc) cores, $(free -g | awk '/Mem:/ { print $2 }') GiB"
          [ -z "$PINNED_CPU" ] || [ "$model" = "$PINNED_CPU" ] || { echo "::error::this runner's CPU is $model, not $PINNED_CPU: re-run this job"; exit 3; }
          [ -z "$PINNED_KERNEL" ] || [[ $(uname -r) == "$PINNED_KERNEL"* ]] || { echo "::error::this runner's kernel is $(uname -r), not $PINNED_KERNEL*: re-run this job"; exit 3; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gVisor ${{ env.GVISOR_RELEASE }}, as alasio's nodes run it
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          base=https://github.com/eaucoin/gvisor/releases/download/release-$GVISOR_RELEASE
          curl -fsSLO "$base/gvisor-x86_64.tar.zstd"
          curl -fsSLO "$base/gvisor-x86_64.tar.zstd.sha512"
          sha512sum -c gvisor-x86_64.tar.zstd.sha512
          mkdir -p gvisor && tar --zstd -xf gvisor-x86_64.tar.zstd -C gvisor
          # runsc with its sidecars (gvisor-bin/), which it finds beside itself.
          from=$(dirname "$(find gvisor -name runsc -type f | head -n 1)")
          ls -la "$from"
          sudo cp -a "$from"/. /usr/local/bin/
          tar -cf "$RUNNER_TEMP/runsc-bundle.tar" -C "$from" .
          runsc --version
          sudo mkdir -p /mnt/val && sudo chown "$USER" /mnt/val
          sudo swapoff -a
      - name: KVM for the sandboxes
        if: matrix.platform == 'kvm'
        run: sudo chmod 666 /dev/kvm && ls -la /dev/kvm
      - name: Arming and first writes
        shell: bash
        env:
          PARTS: ${{ inputs.arm-parts }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          for part in $PARTS; do
            if [ "$part" = rates ] && [ "$PLATFORM" != systrap ]; then continue; fi
            sudo --preserve-env=ImageOS,ImageVersion python3 bench/val/arm.py "$part" --runsc /usr/local/bin/runsc --platform "$PLATFORM" --out "$RUNNER_TEMP/out/arm-$PLATFORM.jsonl"
          done
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: val-arm-${{ matrix.platform }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn

  # G-23 and the host's floor: bench/val/uffd.c on the runner's 7.0 and in a VM of Debian 13's 6.12.
  uffd:
    needs: plan
    if: contains(needs.plan.outputs.raw, '"uffd"')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(needs.plan.outputs.kernels) }}
    steps:
      - name: The runner's CPU and kernel, as pinned
        shell: bash
        env:
          PINNED_CPU: ${{ inputs.cpu }}
          PINNED_KERNEL: ${{ inputs.kernel }}
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)
          echo "CPU $model, kernel $(uname -r), $(nproc) cores, $(free -g | awk '/Mem:/ { print $2 }') GiB"
          [ -z "$PINNED_CPU" ] || [ "$model" = "$PINNED_CPU" ] || { echo "::error::this runner's CPU is $model, not $PINNED_CPU: re-run this job"; exit 3; }
          [ -z "$PINNED_KERNEL" ] || [[ $(uname -r) == "$PINNED_KERNEL"* ]] || { echo "::error::this runner's kernel is $(uname -r), not $PINNED_KERNEL*: re-run this job"; exit 3; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: userfaultfd write protection
        shell: bash
        env:
          KERNEL: ${{ matrix.kernel }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          gcc -O2 -static -pthread -o "$RUNNER_TEMP/uffd" bench/val/uffd.c
          sudo swapoff -a
          echo "shmem THP: $(cat /sys/kernel/mm/transparent_hugepage/shmem_enabled); anon THP: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
          run='./uffd efault; ./uffd fault 256 5; ./uffd fault 1024 3; ./uffd arm 1024 5; ./uffd arm 3072 5'
          if [ "$KERNEL" = runner ]; then
            (cd "$RUNNER_TEMP" && uname -r && sudo sh -c "$run") | tee "$RUNNER_TEMP/out/uffd-$KERNEL.jsonl"
          else
            bench/val/vm612.sh 12288 "$run" "$RUNNER_TEMP/uffd" | tee "$RUNNER_TEMP/out/uffd-$KERNEL.jsonl"
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: val-uffd-${{ matrix.kernel }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn

  # E8 = X-ZSWAP: bench/val/zswap.py.
  zswap:
    needs: plan
    if: contains(needs.plan.outputs.raw, '"zswap"')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: The runner's CPU and kernel, as pinned
        shell: bash
        env:
          PINNED_CPU: ${{ inputs.cpu }}
          PINNED_KERNEL: ${{ inputs.kernel }}
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)
          echo "CPU $model, kernel $(uname -r), $(nproc) cores, $(free -g | awk '/Mem:/ { print $2 }') GiB"
          [ -z "$PINNED_CPU" ] || [ "$model" = "$PINNED_CPU" ] || { echo "::error::this runner's CPU is $model, not $PINNED_CPU: re-run this job"; exit 3; }
          [ -z "$PINNED_KERNEL" ] || [[ $(uname -r) == "$PINNED_KERNEL"* ]] || { echo "::error::this runner's kernel is $(uname -r), not $PINNED_KERNEL*: re-run this job"; exit 3; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gVisor ${{ env.GVISOR_RELEASE }}, as alasio's nodes run it
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          base=https://github.com/eaucoin/gvisor/releases/download/release-$GVISOR_RELEASE
          curl -fsSLO "$base/gvisor-x86_64.tar.zstd"
          curl -fsSLO "$base/gvisor-x86_64.tar.zstd.sha512"
          sha512sum -c gvisor-x86_64.tar.zstd.sha512
          mkdir -p gvisor && tar --zstd -xf gvisor-x86_64.tar.zstd -C gvisor
          # runsc with its sidecars (gvisor-bin/), which it finds beside itself.
          from=$(dirname "$(find gvisor -name runsc -type f | head -n 1)")
          ls -la "$from"
          sudo cp -a "$from"/. /usr/local/bin/
          tar -cf "$RUNNER_TEMP/runsc-bundle.tar" -C "$from" .
          runsc --version
          sudo mkdir -p /mnt/val && sudo chown "$USER" /mnt/val
          sudo swapoff -a
      - name: A frozen sandbox reclaimed into zswap and faulted back
        shell: bash
        env:
          ZSWAP_ARGS: ${{ inputs.zswap-args }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          command -v lz4 >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq lz4 zstd >/dev/null; }
          sudo --preserve-env=ImageOS,ImageVersion python3 bench/val/zswap.py --runsc /usr/local/bin/runsc --out "$RUNNER_TEMP/out/zswap.jsonl" $ZSWAP_ARGS
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: val-zswap
          path: ${{ runner.temp }}/out
          if-no-files-found: warn

  # X-OOM: bench/val/oom.py on the runner's 7.0 and in a VM of Debian 13's 6.12.
  oom:
    needs: plan
    if: contains(needs.plan.outputs.raw, '"oom"')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(needs.plan.outputs.kernels) }}
    steps:
      - name: The runner's CPU and kernel, as pinned
        shell: bash
        env:
          PINNED_CPU: ${{ inputs.cpu }}
          PINNED_KERNEL: ${{ inputs.kernel }}
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)
          echo "CPU $model, kernel $(uname -r), $(nproc) cores, $(free -g | awk '/Mem:/ { print $2 }') GiB"
          [ -z "$PINNED_CPU" ] || [ "$model" = "$PINNED_CPU" ] || { echo "::error::this runner's CPU is $model, not $PINNED_CPU: re-run this job"; exit 3; }
          [ -z "$PINNED_KERNEL" ] || [[ $(uname -r) == "$PINNED_KERNEL"* ]] || { echo "::error::this runner's kernel is $(uname -r), not $PINNED_KERNEL*: re-run this job"; exit 3; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gVisor ${{ env.GVISOR_RELEASE }}, as alasio's nodes run it
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          base=https://github.com/eaucoin/gvisor/releases/download/release-$GVISOR_RELEASE
          curl -fsSLO "$base/gvisor-x86_64.tar.zstd"
          curl -fsSLO "$base/gvisor-x86_64.tar.zstd.sha512"
          sha512sum -c gvisor-x86_64.tar.zstd.sha512
          mkdir -p gvisor && tar --zstd -xf gvisor-x86_64.tar.zstd -C gvisor
          # runsc with its sidecars (gvisor-bin/), which it finds beside itself.
          from=$(dirname "$(find gvisor -name runsc -type f | head -n 1)")
          ls -la "$from"
          sudo cp -a "$from"/. /usr/local/bin/
          tar -cf "$RUNNER_TEMP/runsc-bundle.tar" -C "$from" .
          runsc --version
          sudo mkdir -p /mnt/val && sudo chown "$USER" /mnt/val
          sudo swapoff -a
      - name: An OOM of two sandboxes' parent
        shell: bash
        env:
          KERNEL: ${{ matrix.kernel }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          gcc -O2 -static -o bench/val/om bench/val/om.c
          if [ "$KERNEL" = runner ]; then
            sudo --preserve-env=ImageOS,ImageVersion python3 bench/val/oom.py --runsc /usr/local/bin/runsc --out "$RUNNER_TEMP/out/oom-$KERNEL.jsonl"
          else
            bench/val/vm612.sh 12288 'swapoff -a; tar -xf runsc-bundle.tar; python3 oom.py --runsc /val/runsc --out /val/oom.jsonl >&2; cat /val/oom.jsonl' \
              "$RUNNER_TEMP/runsc-bundle.tar" bench/val/common.py bench/val/oom.py bench/val/om bench/val/om.c > "$RUNNER_TEMP/out/oom-$KERNEL.jsonl"
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: val-oom-${{ matrix.kernel }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn

  # G-18: upstream gVisor master with and without the restore's first clock sample, bench/val/g18.py.
  g18:
    needs: plan
    if: contains(needs.plan.outputs.raw, '"g18"')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: The runner's CPU and kernel, as pinned
        shell: bash
        env:
          PINNED_CPU: ${{ inputs.cpu }}
          PINNED_KERNEL: ${{ inputs.kernel }}
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)
          echo "CPU $model, kernel $(uname -r), $(nproc) cores, $(free -g | awk '/Mem:/ { print $2 }') GiB"
          [ -z "$PINNED_CPU" ] || [ "$model" = "$PINNED_CPU" ] || { echo "::error::this runner's CPU is $model, not $PINNED_CPU: re-run this job"; exit 3; }
          [ -z "$PINNED_KERNEL" ] || [[ $(uname -r) == "$PINNED_KERNEL"* ]] || { echo "::error::this runner's kernel is $(uname -r), not $PINNED_KERNEL*: re-run this job"; exit 3; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Upstream master's runsc, as it is and without the first clock sample
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch go https://github.com/google/gvisor "$RUNNER_TEMP/gvisor"
          cd "$RUNNER_TEMP/gvisor"
          echo "upstream go branch at $(git rev-parse HEAD): $(git log -1 --format=%s)"
          grep -q 'Calibrating the clocks takes two samples' runsc/boot/restore.go || { echo "::error::the go branch's restore has no clock pre-calibration"; exit 1; }
          # The runner's Go, which fetches the toolchain go.mod asks for (GOTOOLCHAIN=auto).
          GOTOOLCHAIN=auto go version
          # The sidecars runsc runs beside itself (gvisor-bin/), as master's latest build ships them, C ones among them, which
          # Go alone does not build; runsc and the Sentry's sidecar built here, from the go branch, as it is and without
          # the restore's first clock sample, the release checks skipped (GVISOR_ENFORCE_RELEASE=SKIP).
          master=https://storage.googleapis.com/gvisor/releases/master/latest/x86_64
          mkdir -p "$RUNNER_TEMP/master"
          curl -fsSL "$master/gvisor.tar.zstd" | tar --zstd -x -C "$RUNNER_TEMP/master"
          ls -laR "$RUNNER_TEMP/master" | head -30
          for build in pre not; do
            if [ "$build" = not ]; then
              sed -i '/^\tclocks.Update(false)$/d' runsc/boot/restore.go
              ! grep -q '^\tclocks.Update(false)$' runsc/boot/restore.go
              git diff --stat
            fi
            out="$RUNNER_TEMP/$build"
            mkdir -p "$out" && cp -a "$RUNNER_TEMP/master/." "$out/"
            CGO_ENABLED=0 go build -o "$out/runsc" ./runsc
            CGO_ENABLED=0 go build -o "$out/gvisor-bin/gvisor_sentry" ./runsc/cmd/sentry
          done
          sudo mkdir -p /mnt/val && sudo chown "$USER" /mnt/val
      - name: The first reads of the time after a restore
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          GVISOR_ENFORCE_RELEASE=SKIP sudo --preserve-env=ImageOS,ImageVersion,GVISOR_ENFORCE_RELEASE python3 bench/val/g18.py --with "$RUNNER_TEMP/pre/runsc" --without "$RUNNER_TEMP/not/runsc" --out "$RUNNER_TEMP/out/g18.jsonl"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: val-g18
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
