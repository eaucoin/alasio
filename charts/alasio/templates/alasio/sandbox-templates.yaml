{{- /*
The templates alasio makes its workspaces' Sandboxes from (src/kube/config.js): a
session filesystem's, and a folder workspace's bayma's. alasio adds to each what is
per Sandbox: its name and labels, bayma's token, and a session's network mode.
*/ -}}
{{- define "alasio.sessionsProfile" -}}
{{- $agent := include "alasio.image" (dict "image" .Values.images.agent "root" .) -}}
namespace: {{ include "alasio.sessionsNamespace" . }}
port: 7290
workspaceDir: /workspace
egressGate: {{ .Values.sessions.egressGate }}
fullModeNameservers: {{- toYaml .Values.sessions.fullModeNameservers | nindent 2 }}
podTemplate:
  metadata:
    labels:
      app.kubernetes.io/part-of: alasio
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: session
  spec:
    {{- with .Values.sessions.runtimeClassName }}
    runtimeClassName: {{ . }}
    {{- end }}
    securityContext: {{- include "alasio.restrictedPod" (dict "uid" 1000 "gid" 1000) | nindent 6 }}
    {{- include "alasio.imagePullSecrets" . | nindent 4 }}
    {{- with .Values.sessions.nodeSelector }}
    nodeSelector: {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.sessions.tolerations }}
    tolerations: {{- toYaml . | nindent 6 }}
    {{- end }}
    initContainers:
      # The workspace and home on the session's volume, and bayma's toolbelt, which the
      # image installs, linked into the home.
      - name: prepare
        image: {{ $agent }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        command:
          - /bin/sh
          - -c
          - mkdir -p /data/workspace /data/home/.local/share/bayma && ln -sfn /opt/bayma-data/bayma/toolbelt /data/home/.local/share/bayma/toolbelt
        securityContext: {{- include "alasio.restrictedContainer" . | nindent 10 }}
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 64Mi }
        volumeMounts:
          - { name: data, mountPath: /data }
    containers:
      - name: bayma
        image: {{ $agent }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        command: [/usr/bin/tini, -s, --, node, /opt/bayma/bayma.js]
        args: [mcp-http, --host, 0.0.0.0, --port, "7290", --state-dir, /home/agent/.bayma]
        workingDir: /workspace
        env:
          - { name: HOME, value: /home/agent }
          - { name: USER, value: agent }
          - { name: BAYMA_PAYLOAD_DIR, value: /opt/bayma/payload }
        ports:
          - { name: mcp, containerPort: 7290 }
        securityContext: {{- include "alasio.restrictedContainer" . | nindent 10 }}
        resources: {{- toYaml .Values.sessions.resources | nindent 10 }}
        volumeMounts:
          - { name: data, mountPath: /workspace, subPath: workspace }
          - { name: data, mountPath: /home/agent, subPath: home }
          - { name: tmp, mountPath: /tmp }
    volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      {{- with .Values.sessions.storage.storageClassName }}
      storageClassName: {{ . }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.sessions.storage.size }}
{{- end -}}

{{- define "alasio.hostProfile" -}}
namespace: {{ include "alasio.hostNamespace" . }}
port: 7290
stateRoot: {{ .Values.host.stateRoot }}
podTemplate:
  metadata:
    labels:
      app.kubernetes.io/part-of: alasio
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: folder-bayma
  spec:
    # May restart alasio, by rolling out its Deployment, as an agent restarts it.
    serviceAccountName: {{ include "alasio.componentName" (dict "root" . "component" "host-agent") }}
    securityContext:
      runAsUser: {{ .Values.host.uid }}
      runAsGroup: {{ .Values.host.gid }}
      {{- with .Values.host.supplementalGroups }}
      supplementalGroups: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- include "alasio.imagePullSecrets" . | nindent 4 }}
    containers:
      - name: bayma
        image: {{ include "alasio.image" (dict "image" .Values.host.baymaImage "root" .) }}
        imagePullPolicy: IfNotPresent
        args: [mcp-http, --host, 0.0.0.0, --port, "7290", --default-durability, checkpointed]
        workingDir: {{ .Values.host.home }}
        env:
          - { name: HOME, value: {{ .Values.host.home | quote }} }
          {{- range $name, $value := .Values.host.env }}
          - { name: {{ $name }}, value: {{ $value | quote }} }
          {{- end }}
        ports:
          - { name: mcp, containerPort: 7290 }
        securityContext:
          # What bayma needs to snapshot its REPL sessions' processes as it stops and
          # restore them whole as it starts again.
          capabilities:
            add: [CHECKPOINT_RESTORE, SYS_PTRACE]
          seccompProfile:
            type: Unconfined
          appArmorProfile:
            type: Unconfined
        resources: {{- toYaml .Values.host.resources | nindent 10 }}
        volumeMounts: {{- include "alasio.hostVolumeMounts" . | nindent 10 }}
    volumes: {{- include "alasio.hostVolumes" . | nindent 6 }}
{{- end -}}

{{- $templates := dict -}}
{{- if .Values.sessions.enabled -}}
{{- $_ := set $templates "sessions" (include "alasio.sessionsProfile" . | fromYaml) -}}
{{- end -}}
{{- if .Values.host.enabled -}}
{{- $_ := set $templates "host" (include "alasio.hostProfile" . | fromYaml) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alasio.componentName" (dict "root" . "component" "sandbox-templates") }}
  labels: {{- include "alasio.componentLabels" (dict "root" . "component" "alasio") | nindent 4 }}
data:
  templates.json: {{ toPrettyJson $templates | quote }}
