# The host profile, as a single machine's operator turns it on, with telemetry.
alasio:
  telegram:
    existingSecret: alasio-telegram
  claude:
    existingSecret: claude
telemetry:
  otlpEndpoint: http://collector.observability.svc:4318
  headersSecret: otel-headers
host:
  enabled: true
  uid: 1000
  gid: 1000
  supplementalGroups: [988]
  home: /home/operator
  stateRoot: /home/operator/.alasio/bayma
  workspaceRoot: /home/operator
  mounts:
    - { name: home, hostPath: /home, mountPath: /home }
    - { name: docker, hostPath: /var/run/docker.sock, mountPath: /var/run/docker.sock, type: Socket }
  env:
    PATH: /home/operator/.local/bin:/usr/local/bin:/usr/bin:/bin
