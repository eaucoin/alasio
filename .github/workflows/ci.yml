name: ci

# On demand only, as an end-to-end run builds every image and brings a cluster up.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/kube-tools
      - run: helm dependency build charts/alasio
      - run: helm lint charts/alasio --strict --values charts/alasio/ci/default-values.yaml
      - run: helm lint charts/alasio --strict --values charts/alasio/ci/host-values.yaml
      - run: helm lint charts/agent-sandbox --strict
      - run: helm unittest charts/alasio
      # The CLI's manifests are the chart's objects, until the chart is removed.
      - run: node --test cli/test/manifests-parity.test.ts

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # One node, and a server with two agents, so the stack and sessions spread.
        agents: [0, 2]
    steps:
      # The cluster holds Neon's images and the agent image, bayma's with every runtime
      # it serves, unpacked: far more disk than a runner starts with free, so the
      # software it comes with that this job does not use goes first.
      - run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/heroku /opt/microsoft /opt/google /opt/az
          docker system prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/kube-tools
      - run: test/e2e/run.sh
        env:
          AGENTS: ${{ matrix.agents }}
