name: ci

# Diagnostics of the gateway's starved GET (not to land).
on:
  workflow_dispatch:
    inputs:
      shards:
        type: string
        default: ""
      previous:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gateway-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
        direct: ["", "1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: mkdir -p "$RUNNER_TEMP/diag" && node --test test/gateway-memory.test.ts
        env:
          ALASIO_GATEWAY_LOAD: "1"
          ALASIO_GATEWAY_DIAG: ${{ runner.temp }}/diag
          ALASIO_GATEWAY_DIRECT: ${{ matrix.direct }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.run }}-${{ matrix.direct }}
          path: ${{ runner.temp }}/diag
