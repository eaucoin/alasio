name: bench
run-name: ${{ inputs.label || 'bench' }}

# Spike: whether SeaweedFS's S3 gateway takes runtime identities scoped to one key prefix (bench/seaweed-identities.sh).
on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        default: "seaweed identities"

permissions:
  contents: read

jobs:
  identities:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ["4.48"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bench/seaweed-identities.sh ${{ matrix.version }}
