{{- if .Values.neon.enabled -}}
{{- $name := include "alasio.neonName" (dict "root" . "component" "setup") -}}
{{- $full := include "alasio.fullname" . -}}
# The stack's secrets, made once and kept, and each service's rendered from them, by
# neon/control/kube-setup.ts before anything of the release starts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "alasio.stackLabels" (dict "root" . "component" "neon-setup") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels: {{- include "alasio.stackLabels" (dict "root" . "component" "neon-setup") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels: {{- include "alasio.stackLabels" (dict "root" . "component" "neon-setup") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels: {{- include "alasio.stackLabels" (dict "root" . "component" "neon-setup") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {{- include "alasio.stackLabels" (dict "root" . "component" "neon-setup") | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      {{- include "alasio.neonPodSpec" . | nindent 6 }}
      containers:
        - name: setup
          image: {{ include "alasio.image" (dict "image" .Values.images.alasio "root" .) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: [node, /opt/alasio/neon/control/kube-setup.ts]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - { name: SECRET_PREFIX, value: {{ $full | quote }} }
            - { name: NEON_BROKER_URL, value: {{ printf "http://%s:50051" (include "alasio.neonName" (dict "root" . "component" "storage-broker")) | quote }} }
            - { name: NEON_CONTROLLER_URL, value: {{ printf "http://%s:1234" (include "alasio.neonName" (dict "root" . "component" "storage-controller")) | quote }} }
            - { name: NEON_PAGESERVER_HOST, value: {{ include "alasio.neonName" (dict "root" . "component" "pageserver") | quote }} }
            - { name: NEON_COMPUTE_HOST, value: {{ include "alasio.neonName" (dict "root" . "component" "compute") | quote }} }
            - { name: NEON_CONTROLLER_DB_HOST, value: {{ include "alasio.neonName" (dict "root" . "component" "controller-db") | quote }} }
            - { name: S3_ENDPOINT, value: {{ include "alasio.s3Endpoint" . | quote }} }
            - { name: S3_REGION, value: {{ .Values.objectStore.external.region | quote }} }
            - { name: S3_BUCKET_NEON, value: {{ .Values.objectStore.buckets.neon | quote }} }
            - { name: S3_BUCKET_LAKE, value: {{ .Values.objectStore.buckets.lake | quote }} }
            {{- if not .Values.objectStore.bundled.enabled }}
            - { name: S3_EXTERNAL, value: "1" }
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "objectStore.external.existingSecret is required with an external object store" .Values.objectStore.external.existingSecret }}
                  key: accessKey
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStore.external.existingSecret }}
                  key: secretKey
            {{- end }}
          securityContext: {{- include "alasio.restrictedContainer" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
{{- end }}
