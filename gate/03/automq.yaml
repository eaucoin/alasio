# AutoMQ 1.7.4, one combined broker and KRaft controller, at the smallest tier of its
# tuning guide ("Tiny": heap 1 g, direct memory 1500 m, WAL cache 500 MiB, block cache
# 100 MiB, upload threshold 60 MiB, pooled direct buffers), its WAL, data and operations
# objects on the bundled SeaweedFS's `log` bucket (gate/store.ts), under a restricted pod
# and capped at 03's budget of 3 GiB (program/budgets.md).
apiVersion: v1
kind: Service
metadata:
  name: automq
  namespace: alasio
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: automq }
  ports:
    - { name: kafka, port: 9092 }
    - { name: controller, port: 9093 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: automq
  namespace: alasio
spec:
  serviceName: automq
  replicas: 1
  selector: { matchLabels: { app: automq } }
  template:
    metadata:
      labels: { app: automq }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 60
      containers:
        - name: automq
          image: automqinc/automq:1.7.4
          command:
            - bash
            - -c
            - |
              exec /opt/automq/kafka/bin/kafka-server-start.sh /opt/automq/kafka/config/kraft/server.properties \
                --override cluster.id=R2F0ZUF1dG9NUVRpbnkwMw \
                --override node.id=0 \
                --override log.dirs=/data/kraft \
                --override controller.quorum.voters=0@$HOST:9093 \
                --override controller.quorum.bootstrap.servers=$HOST:9093 \
                --override advertised.listeners=PLAINTEXT://$HOST:9092,CONTROLLER://$HOST:9093 \
                --override s3.data.buckets="0@s3://$BUCKET?region=us-east-1&endpoint=$ENDPOINT&pathStyle=true" \
                --override s3.ops.buckets="1@s3://$BUCKET?region=us-east-1&endpoint=$ENDPOINT&pathStyle=true" \
                --override s3.wal.path="0@s3://$BUCKET?region=us-east-1&endpoint=$ENDPOINT&pathStyle=true" \
                --override s3.stream.allocator.policy=POOLED_DIRECT \
                --override s3.wal.cache.size=524288000 \
                --override s3.block.cache.size=104857600 \
                --override s3.wal.upload.threshold=62914560 \
                --override log.retention.hours=24 \
                --override auto.create.topics.enable=false
          env:
            - { name: HOST, value: automq-0.automq.alasio.svc.cluster.local }
            - { name: ENDPOINT, value: "http://alasio-seaweedfs.alasio.svc:8333" }
            - { name: BUCKET, valueFrom: { secretKeyRef: { name: gate-s3, key: bucket } } }
            - { name: KAFKA_S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: gate-s3, key: accessKey } } }
            - { name: KAFKA_S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: gate-s3, key: secretKey } } }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms1g -Xmx1g -XX:MetaspaceSize=96m -XX:MaxDirectMemorySize=1500m" }
            - { name: LOG_DIR, value: /logs }
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          readinessProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 3Gi }
            limits: { memory: 3Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: logs, mountPath: /logs }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: logs, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
