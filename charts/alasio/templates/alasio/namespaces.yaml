{{- /*
The namespaces workspaces run in. Sessions enforce Pod Security "restricted": nothing
privileged, no host paths, no added capabilities. The host profile's is "privileged",
as its pods mount the machine; the chart makes it only when the profile is on.
*/ -}}
{{- if and .Values.sessions.enabled .Values.sessions.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "alasio.sessionsNamespace" . }}
  labels:
    {{- include "alasio.componentLabels" (dict "root" . "component" "session") | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
  annotations:
    # Sessions' volumes are in it; uninstalling does not delete them.
    helm.sh/resource-policy: keep
{{- end }}
{{- if and .Values.host.enabled .Values.host.createNamespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "alasio.hostNamespace" . }}
  labels:
    {{- include "alasio.componentLabels" (dict "root" . "component" "folder-bayma") | nindent 4 }}
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
