name: bench
run-name: ${{ inputs.label || 'bench' }}

# Spike: per-object presigned GET URLs on SeaweedFS's S3 gateway and another S3 store (bench/presigned-urls.sh).
on:
  workflow_dispatch:
    inputs:
      label:
        type: string
        default: "presigned urls"

permissions:
  contents: read

jobs:
  presigned:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bench/presigned-urls.sh versitygw
