name: kube-tools
description: k3d, kubectl, helm and helm-unittest, pinned and verified by checksum.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/kube-tools"
        mkdir -p "$bin"
        fetch() { # url sha256 dest
          curl -fsSL --retry 3 -o "$3" "$1"
          echo "$2  $3" | sha256sum -c -
        }
        fetch https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64 \
          06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0 "$bin/k3d"
        fetch https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl \
          65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8 "$bin/kubectl"
        fetch https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz \
          86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb "$RUNNER_TEMP/helm.tgz"
        tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
        mv "$RUNNER_TEMP/linux-amd64/helm" "$bin/helm"
        chmod +x "$bin"/*
        echo "$bin" >>"$GITHUB_PATH"
        # helm-unittest's plugin package, whose binary is the one its release's
        # checksums list; its signature needs a keyring the runner lacks.
        fetch https://github.com/helm-unittest/helm-unittest/releases/download/v1.2.0/unittest-1.2.0.tgz \
          20b0ad5bf5d594dbd8edffd99b5cd8ebb36e084406386cb280e776186d7aed04 "$RUNNER_TEMP/unittest.tgz"
        "$bin/helm" plugin install "$RUNNER_TEMP/unittest.tgz" --verify=false || "$bin/helm" plugin list | grep -q unittest
