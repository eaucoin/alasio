suite: neon
templates:
  - templates/neon/setup.yaml
  - templates/neon/storage.yaml
  - templates/neon/compute.yaml
  - templates/neon/seaweedfs.yaml
  - templates/neon/collector.yaml
  - templates/lake.yaml
set:
  alasio.telegram.existingSecret: telegram
tests:
  - it: makes the stack's secrets in a hook before anything starts
    template: templates/neon/setup.yaml
    documentSelector: { path: kind, value: Job }
    asserts:
      - equal: { path: 'metadata.annotations["helm.sh/hook"]', value: "pre-install,pre-upgrade" }
      - equal: { path: 'spec.template.spec.containers[0].command', value: [node, /opt/alasio/neon/control/kube-setup.js] }
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: S3_EXTERNAL, value: "1" }
  - it: places each timeline on as many safekeepers as run
    template: templates/neon/storage.yaml
    set:
      neon.safekeepers.replicas: 5
    asserts:
      - equal: { path: spec.replicas, value: 5 }
        documentSelector: { path: 'spec.template.metadata.labels["app.kubernetes.io/component"]', value: neon-safekeeper }
      - matchRegex: { path: 'spec.template.spec.containers[0].command[2]', pattern: '--timeline-safekeeper-count 5' }
        documentSelector: { path: 'spec.template.metadata.labels["app.kubernetes.io/component"]', value: neon-storage-controller }
  - it: registers every safekeeper with neon-control by its stable name
    template: templates/neon/compute.yaml
    documentSelector: { path: 'spec.template.metadata.labels["app.kubernetes.io/component"]', value: neon-control }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEON_SAFEKEEPER_HOSTS
            value: RELEASE-NAME-alasio-neon-safekeeper-0.RELEASE-NAME-alasio-neon-safekeeper.NAMESPACE.svc.cluster.local,RELEASE-NAME-alasio-neon-safekeeper-1.RELEASE-NAME-alasio-neon-safekeeper.NAMESPACE.svc.cluster.local,RELEASE-NAME-alasio-neon-safekeeper-2.RELEASE-NAME-alasio-neon-safekeeper.NAMESPACE.svc.cluster.local
  - it: runs one compute at a time, its spec fetched from neon-control
    template: templates/neon/compute.yaml
    documentSelector: { path: 'spec.template.metadata.labels["app.kubernetes.io/component"]', value: neon-compute }
    asserts:
      - equal: { path: spec.strategy.type, value: Recreate }
      - contains: { path: 'spec.template.spec.containers[0].args', content: --control-plane-uri }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: OTEL_SDK_DISABLED, value: "true" }
  - it: traces the compute where the deployment's telemetry goes, when it goes anywhere
    template: templates/neon/compute.yaml
    set:
      telemetry.otlpEndpoint: http://collector:4318
    documentSelector: { path: 'spec.template.metadata.labels["app.kubernetes.io/component"]', value: neon-compute }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://collector:4318 }
  - it: pins every third-party image by digest
    templates: [templates/neon/storage.yaml, templates/neon/compute.yaml, templates/neon/seaweedfs.yaml]
    asserts:
      - matchRegex: { path: 'spec.template.spec.containers[0].image', pattern: '(@sha256:[0-9a-f]{64}|alasio:1\.0\.0)$' }
        documentSelector: { path: kind, value: StatefulSet, matchMany: true }
  - it: uses the operator's object store and makes no SeaweedFS when told
    set:
      objectStore.bundled.enabled: false
      objectStore.external.endpoint: https://s3.example.com
      objectStore.external.existingSecret: s3
    asserts:
      - hasDocuments: { count: 0 }
        template: templates/neon/seaweedfs.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: S3_EXTERNAL, value: "1" }
        template: templates/neon/setup.yaml
        documentSelector: { path: kind, value: Job }
  - it: runs no Neon when the database is the operator's
    set:
      neon.enabled: false
      neon.external.existingSecret: db
    asserts:
      - hasDocuments: { count: 0 }
        template: templates/neon/storage.yaml
      - hasDocuments: { count: 0 }
        template: templates/lake.yaml
  - it: runs the collector only with somewhere to send to
    asserts:
      - hasDocuments: { count: 0 }
        template: templates/neon/collector.yaml
  - it: scrapes every service of the stack when it does
    template: templates/neon/collector.yaml
    set:
      telemetry.otlpEndpoint: http://collector:4318
    documentSelector: { path: kind, value: ConfigMap }
    asserts:
      - matchRegex: { path: 'data["config.yaml"]', pattern: 'RELEASE-NAME-alasio-neon-safekeeper-2.RELEASE-NAME-alasio-neon-safekeeper:7676' }
      - matchRegex: { path: 'data["config.yaml"]', pattern: 'RELEASE-NAME-alasio-lake:9464' }
