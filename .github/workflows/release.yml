name: release

# On demand only, from the version tag being released: publishes alasio's images to
# GitHub's container registry, each attested, and its command line, pinned to them by
# digest, to npm as the package `alasio`, with provenance.
#
# The images must be public, as `npx alasio up` pulls them without a login. GitHub makes a
# new package private, and its API cannot change a package's visibility, so the owner
# makes each of the four public once, in its package settings, after the first release
# made it; the step after the push warns of any not public yet.
#
# npm: with a trusted publisher configured for the package on npmjs.com (this repository,
# this workflow), npm publishes with this run's OIDC token, and the NPM_TOKEN secret is
# not needed; without one, npm publishes with the token the NPM_TOKEN secret holds.
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  # Where cli/src/release.ts says alasio's images are.
  REGISTRY: ghcr.io/eaucoin

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The images and the package take the tag's version, so a run from a branch stops first.
      - run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] ||
            { echo "::error::Run the release from a v* tag, not $GITHUB_REF"; exit 1; }
      # bayma's image, which the agent image is built on, takes more disk than a runner
      # starts with free, and the images are built at once: each directory is removed at
      # once, in the background, while the job readies the release; the step before the
      # build waits for it.
      - name: Free disk space, in the background
        shell: bash
        run: |
          (
            pids=()
            for dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
              sudo rm -rf "$dir" &
              pids+=($!)
            done
            status=0
            for pid in "${pids[@]}"; do wait "$pid" || status=1; done
            echo "$status" >"$RUNNER_TEMP/disk-freed.part" && mv "$RUNNER_TEMP/disk-freed.part" "$RUNNER_TEMP/disk-freed"
          ) >"$RUNNER_TEMP/disk-freed.log" 2>&1 &
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          # Writes an .npmrc that authenticates to npm with NODE_AUTH_TOKEN.
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11.6.2
      - name: The tag, the repository's package and the command line's agree on the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          test "$(node -p 'require("./cli/package.json").version')" = "$version"
          echo "VERSION=$version" >>"$GITHUB_ENV"
      - run: npm ci
      - name: Wait for the disk space
        run: |
          until [ -f "$RUNNER_TEMP/disk-freed" ]; do sleep 1; done
          cat "$RUNNER_TEMP/disk-freed.log"
          exit "$(cat "$RUNNER_TEMP/disk-freed")"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # All four at once, each line said with its image's name; then each one's digest.
      - id: images
        name: Build and push the images, recording their digests
        shell: bash
        env:
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          declare -A pids
          for image in "alasio:." "alasio-agent:sandbox/agent" "alasio-lake:neon/lake" "alasio-node:cluster/node"; do
            name=${image%%:*}
            {
              docker build --tag "$REGISTRY/$name:$VERSION" \
                --label "org.opencontainers.image.source=$SOURCE" \
                --label "org.opencontainers.image.version=$VERSION" "${image#*:}" &&
                docker push "$REGISTRY/$name:$VERSION"
            } 2>&1 | sed -u "s/^/$name: /" &
            pids[$name]=$!
          done
          failed=0
          for name in "${!pids[@]}"; do
            wait "${pids[$name]}" || { echo "::error::$name was not built and pushed"; failed=1; }
          done
          [ "$failed" = 0 ] || exit 1
          for name in "${!pids[@]}"; do
            digest=$(docker image inspect "$REGISTRY/$name:$VERSION" --format '{{index .RepoDigests 0}}')
            echo "${name//-/_}=${digest#*@}" >>"$GITHUB_OUTPUT"
          done
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/alasio
          subject-digest: ${{ steps.images.outputs.alasio }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/alasio-agent
          subject-digest: ${{ steps.images.outputs.alasio_agent }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/alasio-lake
          subject-digest: ${{ steps.images.outputs.alasio_lake }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/alasio-node
          subject-digest: ${{ steps.images.outputs.alasio_node }}
          push-to-registry: true
      - name: The images are public
        run: |
          for name in alasio alasio-agent alasio-lake alasio-node; do
            repository="${REGISTRY#ghcr.io/}/$name"
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:$repository:pull" | jq -r .token)
            curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/$repository/manifests/$VERSION" ||
              echo "::warning::$REGISTRY/$name is not public yet: make it public in its package settings, as alasio pulls it without a login"
          done
      - name: Pin the command line to the images just published
        env:
          ALASIO: ${{ steps.images.outputs.alasio }}
          AGENT: ${{ steps.images.outputs.alasio_agent }}
          LAKE: ${{ steps.images.outputs.alasio_lake }}
          NODE: ${{ steps.images.outputs.alasio_node }}
        run: |
          node tooling/pin-release.ts "$VERSION" "alasio=$ALASIO" "alasio-agent=$AGENT" "alasio-lake=$LAKE" "alasio-node=$NODE"
          git diff cli/src/release.ts
      # Builds the command line, packs and checks its package, and runs it from an install of it.
      - run: node tooling/cli-package.ts
      # Tolerates a re-run over a version npm has already.
      - name: Publish the command line to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "alasio@$VERSION" version >/dev/null 2>&1; then
            echo "alasio $VERSION is on npm already"
          else
            npm publish --workspace cli --provenance --access public
          fi
      # Tolerates a re-run over an existing release.
      - run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "alasio $VERSION" --generate-notes \
              --notes "Install and start it, on a Linux machine with Docker and Node 24: \`npx alasio@$VERSION init\`"
        env:
          GH_TOKEN: ${{ github.token }}
