# AutoMQ 1.7.4 as 03 runs it, for the log gate (gate/log/run.sh): one combined broker and
# KRaft controller; clients on SASL_PLAINTEXT with SCRAM-SHA-512, the controller on its own
# listener; the StandardAuthorizer, nothing allowed without an ACL but to the super user.
process.roles=broker,controller
node.id=0
controller.quorum.voters=0@automq:9093
listeners=CLIENT://:9092,CONTROLLER://:9093
advertised.listeners=CLIENT://automq:9092
listener.security.protocol.map=CLIENT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=CLIENT
controller.listener.names=CONTROLLER
sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
listener.name.client.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="admin-secret";
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
super.users=User:admin;User:ANONYMOUS
allow.everyone.if.no.acl.found=false
log.dirs=/data/kraft
auto.create.topics.enable=false
log.retention.hours=24
s3.data.buckets=0@s3://log?region=us-east-1&endpoint=http://s3:8333&pathStyle=true
s3.ops.buckets=1@s3://log?region=us-east-1&endpoint=http://s3:8333&pathStyle=true
s3.wal.path=0@s3://log?region=us-east-1&endpoint=http://s3:8333&pathStyle=true
s3.stream.allocator.policy=POOLED_DIRECT
s3.wal.cache.size=524288000
s3.block.cache.size=104857600
s3.wal.upload.threshold=62914560
# Its metrics, for the collector to scrape, in Prometheus's format.
s3.telemetry.metrics.exporter.uri=prometheus://?host=0.0.0.0&port=9464
s3.telemetry.metrics.level=INFO
