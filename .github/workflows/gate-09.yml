name: gate-09

# 09's gate (gate/09/run.sh), on its tracks' branches alone, whenever what it runs changes:
# k3s on the runner, gVisor from alasio's fork, stargz-snapshotter's standalone daemon; with
# its background fetch on, as by default, one layer at a time, and off, which G5 compares.
on:
  push:
    branches: [track/wave0-gates, track/lazy-pulling-gate]
    paths: [.github/workflows/gate-09.yml, gate/09/**, gate/k3s.sh]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lazy-pulling:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        fetch: [background, background-one-at-a-time]
    steps:
      # The sandbox image is pushed whole and as eStargz, and pulled again by the node.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - run: gate/09/run.sh
        env:
          OUT: ${{ runner.temp }}/gate-09
          STARGZ_OPTIONS: ${{ matrix.fetch == 'on-demand' && 'no_background_fetch = true' || matrix.fetch == 'background-one-at-a-time' && 'max_concurrency = 1' || '' }}
      - name: The node, when something failed
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n gate describe pods || true
          sudo journalctl -u stargz-snapshotter --no-pager | tail -100
          sudo journalctl -u k3s --no-pager | grep -iE 'stargz|snapshot|runsc|error' | tail -100
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-09-${{ matrix.fetch }}
          path: ${{ runner.temp }}/gate-09

  # The box's cut-over from overlayfs (gate/09/cutover.sh), rehearsed.
  cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: gate/09/cutover.sh
        env:
          OUT: ${{ runner.temp }}/gate-09-cutover
      - name: The node, when something failed
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          sudo journalctl -u k3s --no-pager | tail -100
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-09-cutover
          path: ${{ runner.temp }}/gate-09-cutover
