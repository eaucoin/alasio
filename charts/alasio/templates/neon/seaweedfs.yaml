{{- if and .Values.neon.enabled .Values.objectStore.bundled.enabled -}}
{{- $name := include "alasio.componentName" (dict "root" . "component" "seaweedfs") -}}
{{- $image := include "alasio.image" (dict "image" .Values.objectStore.bundled.image "root" .) -}}
{{- $shell := printf "printf '%%s\\n' \"$1\" | weed shell -master=127.0.0.1:9333 -filer=127.0.0.1:8888" -}}
# The object store: SeaweedFS, one server with its S3 gateway, its identities from the
# stack's setup, a bucket each for Neon, the lake and backups.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "alasio.stackLabels" (dict "root" . "component" "seaweedfs") | nindent 4 }}
spec:
  selector: {{- include "alasio.selectorLabels" (dict "root" . "component" "seaweedfs") | nindent 4 }}
  # Every port its servers advertise themselves on by the Service's name, gRPC's each
  # the HTTP port plus 10000.
  ports:
    - { name: s3, port: 8333 }
    - { name: s3-grpc, port: 18333 }
    - { name: master, port: 9333 }
    - { name: master-grpc, port: 19333 }
    - { name: volume, port: 8080 }
    - { name: volume-grpc, port: 18080 }
    - { name: filer, port: 8888 }
    - { name: filer-grpc, port: 18888 }
    - { name: metrics, port: 9327 }
---
# The server's own stable name, which it advertises and reaches itself by (its master
# elects itself leader through it) before it is ready, as the Service above admits
# clients only once its buckets exist.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-peers
  labels: {{- include "alasio.stackLabels" (dict "root" . "component" "seaweedfs") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "alasio.selectorLabels" (dict "root" . "component" "seaweedfs") | nindent 4 }}
  ports:
    - { name: master, port: 9333 }
    - { name: master-grpc, port: 19333 }
    - { name: volume, port: 8080 }
    - { name: volume-grpc, port: 18080 }
    - { name: filer, port: 8888 }
    - { name: filer-grpc, port: 18888 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "alasio.stackLabels" (dict "root" . "component" "seaweedfs") | nindent 4 }}
spec:
  serviceName: {{ $name }}-peers
  replicas: 1
  selector:
    matchLabels: {{- include "alasio.selectorLabels" (dict "root" . "component" "seaweedfs") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "alasio.stackLabels" (dict "root" . "component" "seaweedfs") | nindent 8 }}
    spec:
      {{- include "alasio.neonPodSpec" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: seaweedfs
          image: {{ $image }}
          imagePullPolicy: IfNotPresent
          args:
            - server
            - -ip=$(POD_NAME).{{ $name }}-peers.$(POD_NAMESPACE).svc.cluster.local
            - -ip.bind=0.0.0.0
            - -dir=/data
            - -volume.max=0
            - -master.volumeSizeLimitMB=1024
            - -master.defaultReplication=000
            - -master.telemetry=false
            - -volume.minFreeSpace=5GiB
            - -filer
            - -s3
            - -s3.config=/etc/seaweedfs/s3.json
            - -s3.allowDeleteBucketNotEmpty=false
            - -s3.autoCreateBucket=false
            - -metricsPort=9327
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          ports:
            - { name: s3, containerPort: 8333 }
            - { name: s3-grpc, containerPort: 18333 }
            - { name: master, containerPort: 9333 }
            - { name: master-grpc, containerPort: 19333 }
            - { name: volume, containerPort: 8080 }
            - { name: volume-grpc, containerPort: 18080 }
            - { name: filer, containerPort: 8888 }
            - { name: filer-grpc, containerPort: 18888 }
            - { name: metrics, containerPort: 9327 }
          readinessProbe:
            httpGet: { path: /healthz, port: s3 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: s3 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          securityContext: {{- include "alasio.restrictedContainer" . | nindent 12 }}
          resources: {{- toYaml .Values.objectStore.bundled.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: identities, mountPath: /etc/seaweedfs, readOnly: true }
        # Makes the buckets, idempotently, each time the server starts: Neon's versioned
        # (its time-travel recovery needs that), writes fsynced. The pod is ready only
        # once they exist, so nothing that stores in them starts before.
        - name: buckets
          image: {{ $image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              shell() { {{ $shell }}; }
              until wget -q -O /dev/null http://127.0.0.1:8333/healthz; do sleep 2; done
              shell 'fs.configure -locationPrefix=/buckets/ -volumeGrowthCount=1 -fsync -apply'
              for bucket in {{ .Values.objectStore.buckets.neon }} {{ .Values.objectStore.buckets.lake }} {{ .Values.objectStore.buckets.backups }}; do
                shell 's3.bucket.list' | grep -qw "$bucket" || shell "s3.bucket.create -name $bucket"
              done
              shell 's3.bucket.versioning -name {{ .Values.objectStore.buckets.neon }} -enable'
              shell 's3.bucket.versioning -name {{ .Values.objectStore.buckets.neon }}' | grep -qi enabled
              touch /tmp/ready
              exec sleep infinity
          readinessProbe:
            exec:
              command: [test, -f, /tmp/ready]
            periodSeconds: 5
          securityContext: {{- include "alasio.restrictedContainer" . | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: shell-tmp, mountPath: /tmp }
        # Old versions of the pageserver's objects expire a week after they are replaced,
        # as Neon's own point-in-time window does; the safekeepers' after a day, the least
        # S3 allows, since each re-uploads the segment it writes, whole, as it grows.
        - name: lifecycle
          image: {{ include "alasio.image" (dict "image" .Values.neon.image "root" .) }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until aws s3api --endpoint-url http://127.0.0.1:8333 head-bucket --bucket {{ .Values.objectStore.buckets.neon }} 2>/dev/null; do sleep 2; done
              aws s3api --endpoint-url http://127.0.0.1:8333 put-bucket-lifecycle-configuration --bucket {{ .Values.objectStore.buckets.neon }} --lifecycle-configuration '{"Rules":[{"ID":"expire-noncurrent","Status":"Enabled","Filter":{"Prefix":"pageserver/"},"NoncurrentVersionExpiration":{"NoncurrentDays":7},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":1}},{"ID":"expire-noncurrent-wal","Status":"Enabled","Filter":{"Prefix":"safekeeper/"},"NoncurrentVersionExpiration":{"NoncurrentDays":1},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":1}}]}'
              touch /tmp/ready
              exec sleep infinity
          env:
            - { name: AWS_DEFAULT_REGION, value: us-east-1 }
            - { name: HOME, value: /tmp }
          envFrom:
            - secretRef:
                name: {{ include "alasio.neonName" (dict "root" . "component" "s3-admin") }}
          readinessProbe:
            exec:
              command: [test, -f, /tmp/ready]
            periodSeconds: 5
          securityContext: {{- include "alasio.restrictedContainer" . | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: lifecycle-tmp, mountPath: /tmp }
      volumes:
        - name: identities
          secret:
            secretName: {{ include "alasio.neonName" (dict "root" . "component" "seaweedfs") }}
        - name: shell-tmp
          emptyDir: {}
        - name: lifecycle-tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec: {{- include "alasio.claimSpec" .Values.objectStore.bundled.storage | nindent 8 }}
---
# SeaweedFS applies lifecycle rules only when asked: a pass every six hours, deleting
# through the S3 server's gRPC port.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "alasio.componentName" (dict "root" . "component" "seaweedfs-lifecycle") }}
  labels: {{- include "alasio.stackLabels" (dict "root" . "component" "seaweedfs-lifecycle") | nindent 4 }}
spec:
  schedule: "41 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: {{- include "alasio.stackLabels" (dict "root" . "component" "seaweedfs-lifecycle") | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- include "alasio.neonPodSpec" . | nindent 10 }}
          containers:
            - name: lifecycle
              image: {{ $image }}
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                # Waits out the moment before its NetworkPolicy applies, as a new pod.
                - until wget -q -O /dev/null http://{{ $name }}:9333/cluster/status; do sleep 2; done && printf 's3.lifecycle.run-shard -shards 0-15 -s3 {{ $name }}:18333 -runtime 10m\n' | weed shell -master={{ $name }}:9333 -filer={{ $name }}:8888
              securityContext: {{- include "alasio.restrictedContainer" . | nindent 16 }}
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
