name: ci

# On demand only, as an end-to-end run builds every image and brings a cluster up.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      # Builds the command line and packs its npm package; checks that the package holds
      # the built command line alone, with the CRD it applies; and runs alasio --version
      # and --help from an install of it.
      - run: node tooling/cli-package.ts

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # One node, and a server with two agents, so the stack and sessions spread.
        agents: [0, 2]
    steps:
      # The cluster holds Neon's images and the agent image, bayma's with every runtime
      # it serves, unpacked: far more disk than a runner starts with free, so the
      # software it comes with that this job does not use goes first.
      - run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/heroku /opt/microsoft /opt/google /opt/az
          docker system prune --all --force
          df -h /
      # Every root process in every container shares the runner's inotify limits, which the
      # cluster's nodes, their pods and JuiceFS's mount pods use up, so alasio's local
      # cluster needs them at least this high (cli/src/cluster/host.ts): raised where lower.
      - run: |
          for limit in max_user_instances=1024 max_user_watches=524288; do
            name="fs.inotify.${limit%=*}"
            [ "$(sysctl -n "$name")" -ge "${limit#*=}" ] || sudo sysctl -w "$name=${limit#*=}"
          done
          sysctl fs.inotify
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      # alasio's package installed, alasio init and up on a cluster of this runner, the
      # end-to-end tests, and alasio uninstall --purge (test/e2e/harness.ts).
      - run: npm run test:e2e
        env:
          ALASIO_E2E_AGENTS: ${{ matrix.agents }}
