# The Telegram stand-in (telegram-stub.ts) as the e2e tests run it in the cluster:
# kubectl create configmap telegram-stub --from-file=telegram-stub.ts first.
apiVersion: v1
kind: Service
metadata:
  name: telegram
spec:
  selector: { app: telegram-stub }
  ports:
    - { name: http, port: 8081 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-stub
spec:
  replicas: 1
  selector:
    matchLabels: { app: telegram-stub }
  template:
    metadata:
      labels: { app: telegram-stub }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: stub
          image: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
          command: [node, /stub/telegram-stub.ts, "8081"]
          ports:
            - { containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /control/calls, port: 8081 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: stub, mountPath: /stub }
      volumes:
        - name: stub
          configMap: { name: telegram-stub }
